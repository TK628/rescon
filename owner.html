<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title id="owner-title">マスターコンソール | オーナー専用ノード</title>
<link href="style.css" rel="stylesheet"/>
<style>
        html, body {
            background-color: #000000; background: radial-gradient(circle at center, #1a0808 0%, #000000 100%); margin: 0; padding: 0; width: 100%; height: 100%; color: white; font-family: 'Verdana', sans-serif;
        }
        .owner-container { max-width: 650px; margin: 0 auto; padding: 30px 20px; text-align: center; }
        .master-title { color: #ff3333; text-shadow: 0 0 12px #ff3333; font-size: 1.8rem; letter-spacing: 3px; font-weight: bold; margin-bottom: 25px; }
        
        .box-panel { background: rgba(20, 0, 0, 0.6); border: 2px solid #ff3333; box-shadow: 0 0 20px rgba(255,51,51,0.3); padding: 25px; border-radius: 6px; text-align: left; margin-bottom: 25px; box-sizing: border-box; }
        .box-title { color: #ff5555; font-size: 0.9rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 15px; border-bottom: 1px dashed rgba(255,51,51,0.3); padding-bottom: 5px; text-transform: uppercase; }
        
        .report-scroller { max-height: 200px; overflow-y: auto; background: #000; border: 1px solid #ff3333; padding: 10px; border-radius: 4px; margin-top: 10px; }
        .report-scroller::-webkit-scrollbar { width: 6px; }
        .report-scroller::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .report-scroller::-webkit-scrollbar-thumb { background: #ff3333; border-radius: 3px; box-shadow: 0 0 5px #ff3333; }
        
        .report-item { border-bottom: 1px solid rgba(255,51,51,0.2); padding: 10px 0; font-size: 13px; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
        .report-item:last-child { border-bottom: none; }
        .report-text-content { color: #eee; line-height: 1.4; word-break: break-all; flex: 1; }
        .report-meta { font-size: 10px; color: #ff9999; text-align: right; min-width: 150px; line-height: 1.6; }
        
        .btn-action-link { color: #ff3333; text-decoration: underline; cursor: pointer; margin-left: 8px; font-weight: bold; }
        .btn-action-link.edit-btn { color: #00ffff; }
        .btn-action-link.pin-btn { color: #ffaa00; }

        .flex-row { display: flex; justify-content: space-between; align-items: center; }
        .switch-label { font-size: 14px; color: #ff9999; font-weight: bold; }
        .cyber-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .cyber-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; border: 1px solid #555; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: #888; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff3333; box-shadow: 0 0 10px #ff3333; border-color: #ff9999; }
        input:checked + .slider:before { transform: translateX(24px); background-color: #fff; }

        textarea, input[type="datetime-local"], input[type="password"], input[type="text"] { width: 100%; background: #000; border: 1px solid #555; color: #fff; padding: 10px; box-sizing: border-box; border-radius: 4px; font-size: 14px; outline: none; color: #ff5555; }
        textarea:focus, input:focus { border-color: #ff3333; box-shadow: 0 0 10px rgba(255,51,51,0.3); }
        
        .btn-master { width: 100%; padding: 12px; background: linear-gradient(135deg, rgba(255, 51, 51, 0.15) 0%, rgba(150, 0, 0, 0.3) 100%); color: #ff9999; border: 1px solid #ff3333; font-weight: bold; cursor: pointer; border-radius: 4px; text-shadow: 0 0 5px #ff3333; letter-spacing: 1px; margin-top: 10px; }
        .btn-master:hover { background: rgba(255, 51, 51, 0.25); box-shadow: 0 0 15px #ff3333; color: #fff; }

        .back-link { margin-top: 40px; background: none; color: #005555; border: none; cursor: pointer; text-decoration: underline; font-weight: bold; z-index: 100; position: relative; display: inline-block; font-size: 13px; }
        .back-link:hover { color: #00ffff; text-shadow: 0 0 5px #00ffff; }
    </style>
</head>
<body>
<div class="owner-container" id="auth-gate">
<div class="box-panel" style="max-width:380px; margin:100px auto 0 auto; text-align:center;">
<div class="box-title" style="text-align:center;">MASTER PRIVILEGE AUTHENTICATION</div>
<input id="owner-pass" placeholder="••••" style="text-align:center; font-size:20px; letter-spacing:4px;" type="password"/>
<button class="btn-master" onclick="unlockConsole()" style="margin-top:15px;">UNLOCK CONSOLE</button>
</div>
<button class="back-link" onclick="location.href='index.html'">← ルーム選択に戻る</button>
</div>
<div class="owner-container" id="console-view" style="display: none;">
<div class="master-title">🚨 SYSTEM MASTER CONSOLE</div>
<div class="box-panel">
<div class="box-title">📩 USER REPORTS &amp; COMMENTS / バグ報告・コメント受付</div>
<div class="report-scroller" id="report-list-container">
<div style="color:#444; text-align:center; font-size:12px; padding:20px;">報告データを読み込み中...</div>
</div>
</div>
<div class="box-panel">
<div class="box-title">SYSTEM LOCKDOWN / メンテナンスモード</div>
<div class="flex-row">
<span class="switch-label">全体一斉ロックダウン状態</span>
<label class="cyber-switch">
<input id="maint-toggle-switch" type="checkbox"/>
<span class="slider"></span>
</label>
</div>
</div>
<div class="box-panel">
<div class="box-title" id="news-form-title">BROADCAST NOTIFICATION / お知らせ配信</div>
<input id="edit-news-key" type="hidden" value=""/>
<textarea id="modal-text" placeholder="お知らせ内容を入力（改行可能）" rows="3" style="margin-bottom:12px;"></textarea>
<div class="flex-row" style="margin-bottom:12px; gap:15px;">
<div style="flex:1;">
<label style="font-size:11px; color:#aaa; display:block; margin-bottom:4px;">予約投稿日時 (空欄で即時):</label>
<input id="modal-time" type="datetime-local"/>
</div>
<div style="flex:1;">
<label style="font-size:11px; color:#aaa; display:block; margin-bottom:4px;">自動削除日時 (空欄で永続):</label>
<input id="modal-delete-time" type="datetime-local"/>
</div>
</div>
<button class="btn-master" id="btn-news-submit" onclick="submitNews()">POST BROADCAST</button>
<button class="btn-master" id="btn-news-cancel" onclick="cancelNewsEdit()" style="display:none; background:none; border-color:#444; color:#666; text-shadow:none; margin-top:5px;">CANCEL EDIT / 編集中止</button>
<label style="font-size:11px; color:#ff5555; display:block; margin-top:20px; font-weight:bold;">◈ CURRENT NOTIFICATIONS / 配信中のお知らせ一覧（ピン留め・編集・削除）</label>
<div class="report-scroller" id="active-news-container">
<div style="color:#333; text-align:center; font-size:11px; padding:10px;">お知らせをロード中...</div>
</div>
</div>
<div class="box-panel">
<div class="box-title" id="update-form-title">SYSTEM UPDATE LOG MANAGEMENT / アップデート履歴管理</div>
<input id="edit-update-key" type="hidden" value=""/>
<div class="flex-row" style="margin-bottom:12px; gap:15px;">
<div style="flex:1;">
<label style="font-size:11px; color:#aaa; display:block; margin-bottom:4px;">VERSION NUMBER / バージョン表記:</label>
<input id="update-version" placeholder="例: 2.1.0" style="color: #00ffff;" type="text"/>
</div>
<div style="flex:1;">
<label style="font-size:11px; color:#aaa; display:block; margin-bottom:4px;">RELEASE DATE / 配信日時 (空欄で本日・現時刻):</label>
<input id="update-date" placeholder="例: 2026/05/16 22:41" style="color: #00ffff;" type="text"/>
</div>
</div>
<label style="font-size:11px; color:#aaa; display:block; margin-bottom:4px;">UPDATE DETAILS / 拡張・変更内容:</label>
<textarea id="update-text" placeholder="・変更内容を入力..." rows="4" style="margin-bottom:12px; color: #00ffff;"></textarea>
<button class="btn-master" id="btn-update-submit" onclick="submitUpdateLog()" style="background: linear-gradient(135deg, rgba(0, 150, 255, 0.15) 0%, rgba(0, 80, 150, 0.3) 100%); border-color: #00ffff; color: #00ffff; text-shadow: 0 0 5px #00ffff;">POST UPDATE LOG</button>
<button class="btn-master" id="btn-update-cancel" onclick="cancelUpdateEdit()" style="display:none; background:none; border-color:#444; color:#666; text-shadow:none; margin-top:5px;">CANCEL EDIT / 編集中止</button>
<label style="font-size:11px; color:#00ffff; display:block; margin-top:20px; font-weight:bold;">◈ CURRENT UPDATE LOGS / 登録済みのアップデート履歴一覧（編集）</label>
<div class="report-scroller" id="active-updates-container">
<div style="color:#333; text-align:center; font-size:11px; padding:10px;">ログをロード中...</div>
</div>
</div>
<button class="btn-master" onclick="location.href='index.html'" style="background:none; border-color:#444; color:#666; text-shadow:none;">SELECT ROOM 画面へ戻る</button>
</div>

<script src="./js/owner.js" type="module"></script></body>
</html>
