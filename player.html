<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選手画面 - ステータスモニター</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: black; margin: 0; color: white; font-family: sans-serif; overflow-x: hidden; }
        #auth-overlay, #master-maintenance-overlay, #game-content { display: none; }
        
        /* 共通アニメーション背景（斜めに流れる水色のグリッド線） */
        .cyber-bg-effect {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotate(15deg);
            animation: grid-move-cyan 20s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        /* システムメンテナンス画面 */
        #master-maintenance-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20000;
            display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }

        /* プレイヤーログイン画面 */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle, #00151a 0%, #000000 100%);
            z-index: 20000;
            display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }

        /* ログインボックス（面取りサイバーガラス） */
        .login-box {
            position: relative; z-index: 5;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.02) 0%, rgba(0, 150, 255, 0.05) 100%);
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.1);
            padding: 40px 30px; border-radius: 6px; width: 85%; max-width: 380px;
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        .login-box h2 {
            font-size: 2rem; letter-spacing: 4px; color: #00ffff; margin: 0 0 15px 0; font-family: monospace;
            text-shadow: 0 0 10px #00ffff, 0 0 20px rgba(0, 255, 255, 0.5);
            animation: blink-cyan 3s infinite alternate;
        }

        .login-box p { color: #b3f7f7; font-size: 14px; margin: 0 0 25px 0; letter-spacing: 1px; text-shadow: 0 0 4px rgba(0,255,255,0.3); line-height: 1.5; }

        /* 説明用アラートテキスト（オレンジ枠線区切り） */
        .login-warning-text {
            font-size: 11px !important;
            color: #ffaa00 !important;
            border-top: 1px dashed rgba(0, 255, 255, 0.2);
            padding-top: 15px;
            margin-top: 25px !important;
            margin-bottom: 0 !important;
            text-shadow: 0 0 4px rgba(255, 170, 0, 0.4) !important;
            text-align: center;
            line-height: 1.6;
        }

        /* スタイリッシュな入力欄 */
        input { 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid #00ffff; 
            color: #fff; 
            padding: 12px; 
            font-size: 22px; 
            text-align: center; 
            outline: none; 
            box-shadow: 0 0 10px rgba(0,255,255,0.2); 
            border-radius: 4px;
            letter-spacing: 8px;
            width: 80%;
            max-width: 200px;
            transition: 0.2s;
        }
        input:focus { box-shadow: 0 0 18px #00ffff; border-color: #fff; }

        /* 透明感のあるネオンガラスボタン */
        .btn-primary { 
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1) 0%, rgba(0, 150, 255, 0.2) 100%); 
            color: #b3f7f7; 
            border: 1px solid #00ffff; 
            padding: 14px 40px; 
            font-size: 16px;
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            box-shadow: 0 0 10px rgba(0,255,255,0.2); 
            border-radius: 4px;
            letter-spacing: 2px;
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.25) 0%, rgba(0, 150, 255, 0.35) 100%); 
            box-shadow: 0 0 20px #00ffff; color: #fff; 
            text-shadow: 0 0 8px #00ffff;
        }

        /* 選手用大画面（本番コンテンツ）デザイン */
        .container { max-width: 700px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        .timer-box {
            border: 2px solid #7cfc00; background: rgba(124, 252, 0, 0.03);
            padding: 15px 60px; border-radius: 8px; text-align: center; margin-bottom: 35px;
            box-shadow: 0 0 20px rgba(124, 252, 0, 0.15);
            position: relative; z-index: 5;
        }
        #countdown-display { font-size: 5rem; font-family: monospace; font-weight: bold; color: white; text-shadow: 0 0 10px rgba(124, 252, 0, 0.3); }

        .avatar-grid { display: flex; justify-content: center; gap: 20px; width: 100%; margin-bottom: 40px; position: relative; z-index: 5; }
        .avatar-card { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
        
        .avatar-frame {
            width: 100%; aspect-ratio: 2 / 3; border: 2px solid #444; background: rgba(255,255,255,0.02);
            border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative;
        }
        .avatar-frame svg { width: 75%; height: 75%; fill: #7cfc00; filter: drop-shadow(0 0 8px rgba(124,252,0,0.3)); }
        .unit-label { position: absolute; top: 8px; left: 12px; font-size: 14px; color: #7cfc00; font-family: monospace; }

        .life-bar-container { width: 100%; background: #000; height: 26px; border: 2px solid #555; margin-top: 12px; border-radius: 13px; overflow: hidden; position: relative; }
        .life-bar-fill { height: 100%; background: #7cfc00; width: 100%; transition: 0.5s ease-out; }
        .life-text { position: absolute; width: 100%; text-align: center; top: 3px; left: 0; font-size: 14px; font-weight: bold; color: white; font-family: monospace; text-shadow: 1px 1px 3px black; }

        /* 審判合流待ち用サイバーガラスレイヤー */
        #judge-waiting-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #00151a 0%, #000000 100%);
            z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        
        .waiting-box {
            position: relative; z-index: 5;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.02) 0%, rgba(0, 150, 255, 0.05) 100%);
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4), inset 0 0 20px rgba(0, 255, 255, 0.1);
            padding: 40px 35px; border-radius: 4px; text-align: center; width: 85%; max-width: 420px;
            backdrop-filter: blur(5px);
        }
        
        .waiting-box h2 {
            font-size: 2.2rem; color: #00ffff; margin: 0 0 15px 0; letter-spacing: 5px; font-family: monospace;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; 
            animation: blink-cyan 2.5s infinite alternate;
        }
        
        .waiting-box p {
            font-size: 0.95rem; color: #b3f7f7; margin: 0 0 10px 0; letter-spacing: 1px; line-height: 1.6;
            text-shadow: 0 0 4px rgba(0, 255, 255, 0.3);
        }

        .waiting-sub-text {
            margin-top: 25px; font-size: 0.8rem; color: #004444; letter-spacing: 1px; font-family: monospace;
            text-transform: uppercase; animation: pulse-cyan 1s infinite alternate;
        }

        .back-link { position: relative; z-index: 10; margin-top: 30px; background: none; color: #005555; border: none; cursor: pointer; text-decoration: underline; font-size: 14px; transition: 0.2s; }
        .back-link:hover { color: #00ffff; text-shadow: 0 0 5px #00ffff; }

        @keyframes grid-move-cyan { 0% { transform: rotate(15deg) translateY(0); } 100% { transform: rotate(15deg) translateY(40px); } }
        @keyframes blink-cyan { 0%, 90%, 94%, 98%, 100% { opacity: 1; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; } 92%, 96% { opacity: 0.3; text-shadow: none; } }
        @keyframes pulse-cyan { 0% { color: #003333; } 100% { color: #00ffff; text-shadow: 0 0 5px #00ffff; } }
    </style>
</head>
<body>
    <div class="cyber-bg-effect"></div>

    <div id="master-maintenance-overlay">
        <h1>SYSTEM MAINTENANCE</h1><p>現在一斉メンテナンス中です。</p>
        <button onclick="location.href='index.html'" style="color:white; border:1px solid white; background:none; padding:10px;">戻る</button>
    </div>

    <div id="auth-overlay">
        <div id="login-fields" style="display:none !important;"></div>

        <div class="login-box">
            <h2>PLAYER LOGIN</h2>
            <p>審判が設定した4桁パスコードを入力してください</p>
            
            <input type="password" id="input-pass" maxlength="4" placeholder="••••"><br><br>
            <button onclick="checkPass()" class="btn-primary">VIEW STATUS</button>
            
            <p class="login-warning-text">
                [ NOTICE ]<br>
                レフリーがルーム作成（ログイン）を完了するまで、この先のモニター環境に接続することはできません。
            </p>
        </div>
        
        <button onclick="location.href='index.html'" class="back-link">← ルーム選択に戻る</button>
    </div>

    <div id="game-content">
        <div class="container">
            <div id="judge-waiting-overlay">
                <div class="waiting-box">
                    <h2>LINKING...</h2>
                    <p>レフリーのエントリーを待機しています。<br>ルームデータ同期プロトコル起動中...</p>
                    <div class="waiting-sub-text">◈ AWAITING REFEREE ENTRY ◈</div>
                </div>
                <button onclick="location.href='index.html'" class="back-link" style="color: #005555;">← DISCONNECT (退室)</button>
            </div>
            
            <div class="timer-box">
                <div id="countdown-display">--:--</div>
            </div>

            <div class="avatar-grid">
                <div id="unit-1" class="avatar-card">
                    <div class="avatar-frame">
                        <span class="unit-label">D-01</span>
                        <svg viewBox="0 0 24 24"><path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,7H13.5A2,2 0 0,1 15.5,9V14.5H14V19H10V14.5H8.5V9A2,2 0 0,1 10.5,7Z"/></svg>
                    </div>
                    <div class="life-bar-container">
                        <div id="d1-fill" class="life-bar-fill"></div>
                        <div id="d1-val" class="life-text">- / -</div>
                    </div>
                </div>

                <div id="unit-2" class="avatar-card">
                    <div class="avatar-frame">
                        <span class="unit-label">D-02</span>
                        <svg viewBox="0 0 24 24"><path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,7H13.5A2,2 0 0,1 15.5,9V14.5H14V19H10V14.5H8.5V9A2,2 0 0,1 10.5,7Z"/></svg>
                    </div>
                    <div class="life-bar-container">
                        <div id="d2-fill" class="life-bar-fill"></div>
                        <div id="d2-val" class="life-text">- / -</div>
                    </div>
                </div>

                <div id="unit-3" class="avatar-card">
                    <div class="avatar-frame">
                        <span class="unit-label">D-03</span>
                        <svg viewBox="0 0 24 24"><path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,7H13.5A2,2 0 0,1 15.5,9V14.5H14V19H10V14.5H8.5V9A2,2 0 0,1 10.5,7Z"/></svg>
                    </div>
                    <div class="life-bar-container">
                        <div id="d3-fill" class="life-bar-fill"></div>
                        <div id="d3-val" class="life-text">- / -</div>
                    </div>
                </div>
            </div>

            <div class="bottom-msg">REAL-TIME DATA LINK ESTABLISHED</div>
            <button onclick="location.href='index.html'" class="back-link" style="color: #444;">← EXIT MONITOR</button>
        </div>
    </div>
    
    <script type="module">
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room') || 'room1';

            setTimeout(() => {
                try {
                    const currentDb = window.db || getDatabase();
                    if (currentDb) {
                        onValue(ref(currentDb, `rooms/${roomId}/online`), (snapshot) => {
                            const isOnline = snapshot.val();
                            const overlay = document.getElementById('judge-waiting-overlay');
                            if (overlay) {
                                if (isOnline === true) {
                                    overlay.style.opacity = '0';
                                    setTimeout(() => { overlay.style.display = 'none'; }, 400);
                                } else {
                                    overlay.style.display = 'flex';
                                    setTimeout(() => { overlay.style.opacity = '1'; }, 10);
                                }
                            }
                        });
                    }
                } catch(e) {
                    console.log("Waiting overlay core ready.");
                }
            }, 1000);
        });
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
