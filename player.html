<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選手画面 - ダミー人形ライフ管理システム</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 初期状態は非表示（チラ見え防止） */
        body { background: black; margin: 0; color: white; font-family: sans-serif; }
        #auth-overlay, #master-maintenance-overlay, #game-content { display: none; }

        /* 認証・メンテナンス画面 */
        #master-maintenance-overlay, #auth-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:20000;
            display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center;
        }
        #master-maintenance-overlay { color:#ff4d4d; }
        input { background: rgba(255,255,255,0.1); border: 1px solid white; color: white; padding: 10px; margin: 10px; font-size: 20px; text-align: center; }
        .btn-primary { background: #7cfc00; color: black; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        
        /* 選手画面専用の大型バー */
        .player-unit { margin-bottom: 40px; }
        .player-bar-bg { background: #222; height: 30px; width: 100%; border-radius: 5px; overflow: hidden; border: 1px solid #444; }
        .player-bar-fill { height: 100%; transition: 0.5s ease-out; }
    </style>
</head>
<body>

    <div id="master-maintenance-overlay">
        <div style="border:1px solid #ff4d4d; padding:30px; background:rgba(255,0,0,0.1); border-radius:10px;">
            <h1>SYSTEM MAINTENANCE</h1>
            <p>現在メンテナンス中です。しばらくお待ちください。</p>
            <button onclick="location.href='index.html'" style="color:white; background:none; border:1px solid white; padding:10px 20px;">戻る</button>
        </div>
    </div>

    <div id="auth-overlay">
        <h2 id="auth-title">PLAYER LOGIN</h2>
        <div id="login-fields" style="display:none; text-align:center;">
            <p id="login-msg">審判が設定したパスコードを入力してください</p>
            <input type="password" id="input-pass" maxlength="4" placeholder="****"><br>
            <button onclick="checkPass()" class="btn-primary">VIEW STATUS</button>
        </div>
        <p id="error-msg" style="color:#ff4d4d; display:none;"></p>
        <button onclick="location.href='index.html'" style="margin-top:40px; background:none; border:none; color:gray; cursor:pointer;">← ルーム選択に戻る</button>
    </div>

    <div id="game-content">
        <div class="container">
            <h1 style="text-align: center; color: #a8e063; letter-spacing: 2px;">STATUS MONITOR</h1>

            <div id="countdown-display" style="text-align: center; font-size: 5rem; font-family: monospace; color: white; margin: 20px 0; text-shadow: 0 0 10px rgba(255,255,255,0.5);">--:--</div>

            <div id="units">
                <div id="unit-1" class="player-unit">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span style="font-weight:bold;">DUMMY 01</span>
                        <span id="d1-val">250 / 250</span>
                    </div>
                    <div class="player-bar-bg">
                        <div id="d1-fill" class="player-bar-fill" style="width: 94%; background: #7cfc00;"></div>
                    </div>
                </div>

                <div id="unit-2" class="player-unit">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span style="font-weight:bold;">DUMMY 02</span>
                        <span id="d2-val">250 / 250</span>
                    </div>
                    <div class="player-bar-bg">
                        <div id="d2-fill" class="player-bar-fill" style="width: 94%; background: #7cfc00;"></div>
                    </div>
                </div>

                <div id="unit-3" class="player-unit">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span style="font-weight:bold;">DUMMY 03</span>
                        <span id="d3-val">250 / 250</span>
                    </div>
                    <div class="player-bar-bg">
                        <div id="d3-fill" class="player-bar-fill" style="width: 94%; background: #7cfc00;"></div>
                    </div>
                </div>
            </div>

            <div style="text-align: center; margin-top: 50px; color: #444; font-size: 0.8rem;">
                REAL-TIME DATA SYNCING...
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
