<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選手画面</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: black; margin: 0; color: white; font-family: sans-serif; }
        #auth-overlay, #master-maintenance-overlay, #game-content { display: none; }
        #master-maintenance-overlay, #auth-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:20000;
            display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center;
        }
        input { background: rgba(255,255,255,0.1); border: 1px solid white; color: white; padding: 10px; font-size: 20px; text-align: center; }
        .btn-primary { background: #7cfc00; color: black; border: none; padding: 10px 20px; font-weight: bold; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .unit-display { margin-bottom: 30px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .bar-bg { background: #000; height: 30px; width: 100%; border-radius: 15px; overflow: hidden; border: 2px solid #333; }
        .bar-fill { height: 100%; transition: 0.5s ease-out; }
    </style>
</head>
<body>
    <div id="master-maintenance-overlay">
        <h1>SYSTEM MAINTENANCE</h1>
        <p>管理者により全機能がロックされています。</p>
        <button onclick="location.href='index.html'">戻る</button>
    </div>
    <div id="auth-overlay">
        <h2>PLAYER LOGIN</h2>
        <div id="login-fields" style="display:none;">
            <p>審判が設定したパスコードを入力してください</p>
            <input type="password" id="input-pass" maxlength="4"><br><br>
            <button onclick="checkPass()" class="btn-primary">VIEW STATUS</button>
        </div>
        <button onclick="location.href='index.html'" style="margin-top:40px; background:none; color:gray; border:none; cursor:pointer;">← 戻る</button>
    </div>

    <div id="game-content">
        <div class="container">
            <h1 style="text-align: center; letter-spacing: 4px; color: #7cfc00;">MONITOR</h1>
            <div id="countdown-display" style="text-align: center; font-size: 6rem; font-family: monospace; margin: 30px 0; font-weight: bold;">--:--</div>
            <div id="units">
                <div id="unit-1" class="unit-display">
                    <div style="display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 10px;">
                        <span>DUMMY 01</span><span id="d1-val">250 / 250</span>
                    </div>
                    <div class="bar-bg">
                        <div id="d1-fill" class="bar-fill" style="background: #7cfc00; width: 94%;"></div>
                    </div>
                </div>
                <div id="unit-2" class="unit-display">
                    <div style="display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 10px;"><span>DUMMY 02</span><span id="d2-val">250 / 250</span></div>
                    <div class="bar-bg"><div id="d2-fill" class="bar-fill" style="background: #7cfc00; width: 94%;"></div></div>
                </div>
                <div id="unit-3" class="unit-display">
                    <div style="display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 10px;"><span>DUMMY 03</span><span id="d3-val">250 / 250</span></div>
                    <div class="bar-bg"><div id="d3-fill" class="bar-fill" style="background: #7cfc00; width: 94%;"></div></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
