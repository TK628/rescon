<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>審判コンソール - ダミーライフ管理</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --------------------------------------------------
         * 🌌 [UI完全固定] ひだまりさんの画像デザイン完全一致
         * -------------------------------------------------- */
        html, body {
            background-color: #000000 !important;
            background: radial-gradient(circle at center, #071316 0%, #000000 100%) !important; 
            margin: 0; padding: 0; color: white; font-family: 'Verdana', sans-serif; overflow-x: hidden;
            width: 100%; height: 100%;
        }
        #auth-overlay, #master-maintenance-overlay, #game-content { display: none; }
        
        .cyber-bg-effect {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px; transform: rotate(12deg); z-index: 1; pointer-events: none; opacity: 0.7;
        }

        #master-maintenance-overlay, #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20000;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
            background: #000000 !important;
        }

        /* 📸 画像（image_de37e0.png）の外枠サイズと発光を完全に再現 */
        .auth-neon-decor-frame {
            position: relative; z-index: 5;
            background: rgba(0, 0, 0, 0.85) !important;
            border: 2px solid #00ffff !important;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5), inset 0 0 15px rgba(0, 255, 255, 0.2) !important;
            padding: 40px 30px; border-radius: 8px; width: 88%; max-width: 440px;
            box-sizing: border-box; text-align: center; margin: 0 auto;
        }
        .auth-neon-decor-frame h2 { font-size: 2.2rem; letter-spacing: 2px; color: #00ffff; margin: 0 0 15px 0; text-shadow: 0 0 8px rgba(0, 255, 255, 0.6); font-weight: bold; text-transform: uppercase; }
        .auth-neon-decor-frame p { color: #b3f7f7; font-size: 13px; margin: 0 0 25px 0; line-height: 1.6; }

        /* 画像通りの入力文字と見出しスタイル */
        .field-title { font-size: 11px; color: #00ffff; font-weight: bold; letter-spacing: 1px; margin: 15px 0 6px 0; text-transform: uppercase; }
        
        /* 📸 画像内の「任意入力」ボックスデザインの完全固定 */
        input.normal-cyber-input, select.normal-cyber-select { 
            background: rgba(0, 10, 15, 0.8) !important; border: 1px solid #00ffff !important; color: #ffffff !important; padding: 12px; 
            font-size: 18px; text-align: center; outline: none; box-shadow: 0 0 12px rgba(0,255,255,0.2); 
            border-radius: 4px; width: 90%; max-width: 280px; display: block; margin: 0 auto; box-sizing: border-box;
        }
        input.normal-cyber-input::placeholder { color: rgba(255,255,255,0.2); }
        input.normal-cyber-input:focus, select.normal-cyber-select:focus { box-shadow: 0 0 20px #00ffff; border-color: #fff; }
        select.normal-cyber-select { text-align-last: center; cursor: pointer; color: #00ffff !important; }
        select.normal-cyber-select option { background: #040c0f; color: #00ffff; }

        /* 📸 画像の「CREATE ROOM」ボタンを完全再現 */
        .btn-primary { 
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.15) 0%, rgba(0, 150, 255, 0.25) 100%) !important; 
            color: #ffffff !important; border: 1px solid #00ffff !important; padding: 14px 40px !important; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 0 15px rgba(0,255,255,0.3) !important; 
            border-radius: 4px; letter-spacing: 2px; text-shadow: 0 0 5px #00ffff !important; width: 90%; max-width: 280px; margin: 20px auto 0 auto; display: block; text-transform: uppercase;
        }
        .btn-primary:hover { background: linear-gradient(135deg, rgba(0, 255, 255, 0.35) 0%, rgba(0, 150, 255, 0.45) 100%) !important; box-shadow: 0 0 25px #00ffff !important; }

        /* 📸 画像下部のオレンジ色のプロトコルテキスト（完全同期） */
        .orange-notice { color: #ffaa00; font-size: 11px; margin-top: 25px; font-weight: bold; letter-spacing: 1px; line-height: 1.5; text-transform: uppercase; text-shadow: 0 0 4px rgba(255,170,0,0.3); }

        /* 🎯 4連スクエア（合流メンバー用ログイン画面専用） */
        .pass-box-container { display: flex; justify-content: center; gap: 12px; margin: 20px auto; position: relative; max-width: 280px; }
        .square-box { width: 50px; height: 50px; background: rgba(0, 20, 25, 0.6); border: 1px solid rgba(0, 255, 255, 0.4); border-radius: 4px; font-size: 24px; color: #00ffff; font-weight: bold; text-align: center; line-height: 48px; text-shadow: 0 0 10px #00ffff; box-sizing: border-box; transition: all 0.15s ease; }
        .square-box.active { border-color: #00ffff; background: rgba(0, 255, 255, 0.15); box-shadow: 0 0 12px rgba(0, 255, 255, 0.5); }
        .hidden-secret-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 10; cursor: text; }

        /* --- 本番審判コントロール画面（完全維持） --- */
        #game-content { background-color: #000000 !important; width: 100%; }
        #game-content .container { max-width: 1200px; margin: 0 auto; padding: 15px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 5; }
        .timer-box { border: 2px solid #00ffff !important; background: rgba(0, 0, 0, 0.7) !important; padding: 12px 50px; border-radius: 4px; text-align: center; margin-bottom: 25px; box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) !important; }
        #countdown-display { font-size: 3.8rem; font-family: monospace; font-weight: bold; color: #00ffff !important; text-shadow: 0 0 10px #00ffff; }
        .avatar-grid { display: flex; justify-content: center; gap: 16px; width: 100%; margin-bottom: 30px; }
        .avatar-card { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; background: rgba(0, 20, 30, 0.5) !important; border: 1px solid rgba(0, 255, 255, 0.4) !important; box-shadow: 0 0 20px rgba(0,255,255,0.15) !important; border-radius: 8px !important; padding: 15px; }
        .avatar-frame { width: 100%; aspect-ratio: 2 / 3; border: 1px solid rgba(0, 255, 255, 0.3) !important; background: rgba(5, 5, 5, 0.8) !important; border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; }
        .avatar-frame svg { width: 70%; height: 70%; fill: #00ffff !important; filter: drop-shadow(0 0 8px rgba(0,255,255,0.4)) !important; }
        .unit-label { position: absolute; top: 8px; left: 12px; font-size: 12px; color: #00ffff !important; font-weight: bold; font-family: monospace; }
        .life-bar-container { width: 100%; background: #111 !important; height: 18px; border: 1px solid rgba(0, 255, 255, 0.4) !important; margin-top: 10px; border-radius: 4px; overflow: hidden; position: relative; }
        .life-bar-fill { height: 100%; background: #00ffff !important; width: 100%; transition: 0.3s ease-out; box-shadow: 0 0 10px #00ffff !important; }
        .life-text { position: absolute; width: 100%; text-align: center; top: 1px; left: 0; font-size: 12px; font-weight: bold; color: white; text-shadow: 0 0 3px #00ffff; font-family: monospace; }
        .dmg-group { display: flex; gap: 6px; width: 100%; margin-top: 10px; }
        .btn-dmg { flex: 1; padding: 10px 2px; font-size: 12px; font-weight: bold; background: #16161c !important; border: 1px solid rgba(0, 255, 255, 0.4) !important; color: #00ffff !important; cursor: pointer; border-radius: 4px; font-family: monospace; transition: 0.1s; }
        .btn-dmg:hover { background: #222 !important; border-color: #ffffff !important; color: #ffffff !important; box-shadow: 0 0 10px #00ffff; }
        .btn-dmg.heavy { border-color: #552222 !important; color: #ff4d4d !important; }
        .btn-dmg.heavy:hover { background: #2a1111 !important; border-color: #ff4d4d !important; color: #ffffff !important; }
        .bottom-panel { width: 100%; background: rgba(5, 5, 5, 0.9) !important; border: 1px solid rgba(0, 255, 255, 0.4) !important; padding: 20px; border-radius: 6px; box-sizing: border-box; margin-top: 15px; max-width: 600px; box-shadow: 0 0 20px rgba(0,255,255,0.2) !important; }
        .panel-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-opt { flex: 1; background: #16161c !important; border: 1px solid #333 !important; color: #777 !important; padding: 12px; cursor: pointer; font-size: 13px; font-weight: bold; font-family: monospace; border-radius: 4px; transition: 0.2s; }
        .btn-opt:hover { color: #fff !important; border-color: #555 !important; }
        .btn-opt.active { background: #00ffff !important; color: black !important; font-weight: bold; border-color: #00ffff !important; box-shadow: 0 0 10px #00ffff !important; }
        .back-link { display: block; text-align: center; color: #005555 !important; font-size: 13px; margin-top: 25px; text-decoration: underline; cursor: pointer; background:none; border:none; font-weight:bold; }
        .back-link:hover { color: #00ffff !important; text-shadow: 0 0 5px #00ffff; }
    </style>
</head>
<body>
    <div class="cyber-bg-effect"></div>

    <div id="master-maintenance-overlay">
        <h1>SYSTEM MAINTENANCE</h1><p>現在一斉メンテナンス中です。</p>
        <button class="btn-exit-trigger" style="color:white; border:1px solid white; background:none; padding:10px;">戻る</button>
    </div>

    <div id="auth-overlay">
        <div class="auth-neon-decor-frame">
            <h2>REFEREE CONSOLE</h2>
            
            <div id="setup-fields" style="display:none; text-align:center;">
                <p>設定する4桁のパスコードを入力してください。空欄のまま作成するとパスワードなしになります。</p>
                
                <div class="field-title">ROOM PASSCODE</div>
                <input type="text" id="set-pass" class="normal-cyber-input" placeholder="任意入力" maxlength="4" autocomplete="off">
                
                <div class="field-title">REFEREE ACCESS LIMIT</div>
                <select id="set-capacity" class="normal-cyber-select">
                    <option value="1">1名（主審のみ）</option>
                    <option value="2">2名</option>
                    <option value="99">無制限</option>
                </select>
                
                <button onclick="setupRoom()" class="btn-primary">CREATE ROOM</button>
                <div style="border-top:1px dashed rgba(0,255,255,0.2); margin-top:25px;"></div>
                <div class="orange-notice">[ REFEREE AUTHORITY ]<br>ルームの構築が完了すると、選手モニターとのデータリンクプロトコルが自動的に同期を開始します。</div>
            </div>
            
            <div id="login-fields" style="display:none; text-align:center;">
                <p>パスコードを入力してください</p>
                <div class="pass-box-container" onclick="focusSecretInput()">
                    <input type="text" id="input-pass" class="hidden-secret-input" maxlength="4" autocomplete="off" pattern="[0-9]*" inputmode="numeric">
                    <div class="square-box" id="box-0"></div>
                    <div class="square-box" id="box-1"></div>
                    <div class="square-box" id="box-2"></div>
                    <div class="square-box" id="box-3"></div>
                </div>
                <button onclick="checkPass()" class="btn-primary">UNLOCK</button>
                <div style="border-top:1px dashed rgba(0,255,255,0.2); margin-top:25px;"></div>
                <div class="orange-notice">[ SECURE AUTH MODE ]</div>
            </div>
        </div>
        <button class="back-link btn-exit-trigger">← ルーム選択に戻る</button>
    </div>

    <div id="game-content">
        <div class="container">
            <div class="timer-box">
                <div id="countdown-display">10:00</div>
                <button id="start-btn" onclick="toggleTimer()" style="margin-top:8px; padding:8px 24px; font-weight:bold; cursor:pointer; background: linear-gradient(135deg, rgba(0, 255, 255, 0.2) 0%, rgba(0, 150, 255, 0.3) 100%); border:1px solid #00ffff; border-radius:4px; font-family:monospace; color:white; box-shadow: 0 0 10px rgba(0,255,255,0.3);">START</button>
            </div>
            <div class="avatar-grid">
                <div id="unit-1" class="avatar-card">
                    <div class="avatar-frame"><span class="unit-label">01</span><svg viewBox="0 0 24 24"><path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,7H13.5A2,2 0 0,1 15.5,9V14.5H14V19H10V14.5H8.5V9A2,2 0 0,1 10.5,7Z"/></svg></div>
                    <div class="life-bar-container"><div id="d1-fill" class="life-bar-fill"></div><div id="d1-val" class="life-text">250/250</div></div>
                    <div class="dmg-group"><button onclick="applyDmg('d1', 4)" class="btn-dmg">DMG 10</button><button onclick="applyDmg('d1', 20)" class="btn-dmg heavy">50</button></div>
                </div>
                <div id="unit-2" class="avatar-card">
                    <div class="avatar-frame"><span class="unit-label">02</span><svg viewBox="0 0 24 24"><path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,7H13.5A2,2 0 0,1 15.5,9V14.5H14V19H10 salvage-V14.5H8.5V9A2,2 0 0,1 10.5,7Z"/></svg></div>
                    <div class="life-bar-container"><div id="d2-fill" class="life-bar-fill"></div><div id="d2-val" class="life-text">250/250</div></div>
                    <div class="dmg-group"><button onclick="applyDmg('d2', 4)" class="btn-dmg">DMG 10</button><button onclick="applyDmg('d2', 20)" class="btn-dmg heavy">50</button></div>
                </div>
                <div id="unit-3" class="avatar-card">
                    <div class="avatar-frame"><span class="unit-label">03</span><svg viewBox="0 0 24 24"><path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,7H13.5A2,2 0 0,1 15.5,9V14.5H14V19H10V14.5H8.5V9A2,2 0 0,1 10.5,7Z"/></svg></div>
                    <div class="life-bar-container"><div id="d3-fill" class="life-bar-fill"></div><div id="d3-val" class="life-text">250/250</div></div>
                    <div class="dmg-group"><button onclick="applyDmg('d3', 4)" class="btn-dmg">DMG 10</button><button onclick="applyDmg('d3', 20)" class="btn-dmg heavy">50</button></div>
                </div>
            </div>
            <div class="bottom-panel">
                <div style="font-size:12px; color:#005555; margin-bottom:8px; font-weight:bold; letter-spacing:1px;">SYSTEM SETTINGS</div>
                <div class="panel-row"><button id="dur-5" onclick="setDuration(5)" class="btn-opt">5 min</button><button id="dur-10" onclick="setDuration(10)" class="btn-opt">10 min</button><button id="dur-15" onclick="setDuration(15)" class="btn-opt">15 min</button></div>
                <div class="panel-row"><button id="cnt-1" onclick="setCount(1)" class="btn-opt">1 BODY</button><button id="cnt-2" onclick="setCount(2)" class="btn-opt">2 BODIES</button><button id="cnt-3" onclick="setCount(3)" class="btn-opt">3 BODIES</button></div>
                <button onclick="resetSystem()" style="width:100%; padding:14px; border:1px solid #552222; color:#ff4d4d; background:none; cursor:pointer; font-weight:bold; font-family:monospace; margin-top:15px; border-radius:4px; transition:0.2s;">RESET ROOM DATA</button>
            </div>
            <button class="back-link btn-exit-trigger">← EXIT ROOM (ルーム選択に戻る)</button>
        </div>
    </div>
    
    <script type="module">
        document.querySelectorAll('.btn-exit-trigger').forEach(btn => {
            btn.addEventListener('click', () => { sessionStorage.removeItem('isAuthorized'); location.href = 'index.html'; });
        });

        // 🎯 部屋設定の入力フォームへのガードプロトコル
        const setPassInput = document.getElementById('set-pass');
        if (setPassInput) {
            setPassInput.addEventListener('keydown', function(e) {
                if ((e.keyCode >= 96 && e.keyCode <= 105) || e.key === 'Enter' && e.code.startsWith('Numpad')) { e.preventDefault(); e.stopPropagation(); }
            });
            setPassInput.addEventListener('compositionstart', function(e) { e.preventDefault(); });
            setPassInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value.length > 4) this.value = this.value.slice(0, 4);
            });
        }

        // 4連ボックスのアクティブ制御
        const secretInput = document.getElementById('input-pass');
        window.focusSecretInput = () => { if(secretInput) secretInput.focus(); };
        if (secretInput) {
            secretInput.addEventListener('keydown', function(e) {
                if ((e.keyCode >= 96 && e.keyCode <= 105) || e.key === 'Enter' && e.code.startsWith('Numpad')) { e.preventDefault(); e.stopPropagation(); }
            });
            secretInput.addEventListener('compositionstart', function(e) { e.preventDefault(); });
            secretInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value.length > 4) this.value = this.value.slice(0, 4);
                const currentLen = this.value.length;
                for (let i = 0; i < 4; i++) {
                    const box = document.getElementById(`box-${i}`);
                    if (!box) continue;
                    if (i < currentLen) { box.innerText = "●"; box.classList.remove('active'); }
                    else { box.innerText = ""; box.classList.remove('active'); }
                    if (i === currentLen) box.classList.add('active');
                }
            });
            document.getElementById('box-0').classList.add('active');
            document.addEventListener('click', () => {
                const overlay = document.getElementById('auth-overlay');
                if(overlay && overlay.style.display !== 'none' && document.getElementById('login-fields').style.display !== 'none') focusSecretInput();
            });
        }

        const isLocal = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";
        if (isLocal) {
            window.switchView = (targetId) => {
                const bypassTarget = (targetId === 'master-maintenance-overlay') ? 'auth-overlay' : targetId;
                const views = ['master-maintenance-overlay', 'auth-overlay', 'game-content'];
                views.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
                const target = document.getElementById(bypassTarget); if (target) target.style.display = (bypassTarget === 'game-content') ? 'block' : 'flex';
            };
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
