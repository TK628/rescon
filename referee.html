<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>審判コンソール</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: black; margin: 0; color: white; font-family: sans-serif; }
        #auth-overlay, #master-maintenance-overlay, #game-content { display: none; }
        #master-maintenance-overlay, #auth-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; 
            background:#000; z-index:20000;
            flex-direction:column; align-items:center; justify-content:center; text-align:center;
        }
        #master-maintenance-overlay { color:#ff4d4d; }
        input, select { background: rgba(255,255,255,0.1); border: 1px solid white; color: white; padding: 10px; margin: 10px; font-size: 20px; }
        select option { background-color: #333; color: white; }
        .btn-primary { background: #7cfc00; color: black; border: none; padding: 15px 30px; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .unit-card { border: 1px solid #333; padding: 20px; margin-bottom: 20px; background: rgba(255,255,255,0.05); }
        .btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .btn-opt { background: #222; border: 1px solid #555; color: white; padding: 12px 5px; cursor: pointer; }
        .btn-opt.active { background: #7cfc00; color: black; }
        .btn-dmg { padding: 12px; background: #333; color: white; border: 1px solid #555; flex: 1; }
    </style>
</head>
<body>
    <div id="master-maintenance-overlay">
        <h1>SYSTEM MAINTENANCE</h1>
        <p>管理者により全機能がロックされています。</p>
        <button onclick="location.href='index.html'" style="color:white; background:none; border:1px solid white; padding:10px;">TOPへ</button>
    </div>

    <div id="auth-overlay">
        <h2 id="auth-title">JUDGE AUTHENTICATION</h2>
        <div id="setup-fields" style="display:none; text-align:center;">
            <p>4桁パスコード設定</p>
            <input type="text" id="set-pass" maxlength="4" placeholder="1234">
            <p>審判定員</p>
            <select id="set-capacity">
                <option value="1">1名</option><option value="2">2名</option><option value="5">5名</option><option value="99">無制限</option>
            </select><br>
            <button onclick="setupRoom()" class="btn-primary">作成</button>
        </div>
        <div id="login-fields" style="display:none; text-align:center;">
            <p id="login-msg">パスコード入力</p>
            <input type="password" id="input-pass" maxlength="4"><br>
            <button onclick="checkPass()" class="btn-primary">UNLOCK</button>
        </div>
        <button onclick="location.href='index.html'" style="margin-top:40px; background:none; color:gray; border:none;">← 戻る</button>
    </div>

    <div id="game-content">
        <div class="container">
            <h1 style="text-align: center; color: #7cfc00;">JUDGE CONSOLE</h1>
            <div style="text-align: center; margin-bottom: 30px;">
                <div id="countdown-display" style="font-size: 4rem; font-family: monospace;">10:00</div>
                <button id="start-btn" onclick="toggleTimer()" style="width: 150px; padding: 15px; font-weight: bold; cursor: pointer;">START</button>
            </div>
            <div id="units">
                <div id="unit-1" class="unit-card">
                    <div style="display: flex; justify-content: space-between;"><span>DUMMY 01</span><span id="d1-val">250 / 250</span></div>
                    <div style="background: #000; height: 12px; margin: 10px 0;"><div id="d1-fill" style="background: #7cfc00; height: 100%; width: 94%;"></div></div>
                    <button onclick="applyDmg('d1', 4)" class="btn-dmg">DMG 10</button>
                </div>
                <div id="unit-2" class="unit-card">
                    <div style="display: flex; justify-content: space-between;"><span>DUMMY 02</span><span id="d2-val">250 / 250</span></div>
                    <div style="background: #000; height: 12px; margin: 10px 0;"><div id="d2-fill" style="background: #7cfc00; height: 100%; width: 94%;"></div></div>
                    <button onclick="applyDmg('d2', 4)" class="btn-dmg">DMG 10</button>
                </div>
                <div id="unit-3" class="unit-card">
                    <div style="display: flex; justify-content: space-between;"><span>DUMMY 03</span><span id="d3-val">250 / 250</span></div>
                    <div style="background: #000; height: 12px; margin: 10px 0;"><div id="d3-fill" style="background: #7cfc00; height: 100%; width: 94%;"></div></div>
                    <button onclick="applyDmg('d3', 4)" class="btn-dmg">DMG 10</button>
                </div>
            </div>
            <div style="background: #111; padding: 15px; border-radius: 8px;">
                <p>TIMER</p>
                <div class="btn-group">
                    <button id="dur-5" onclick="setDuration(5)" class="btn-opt">5 min</button>
                    <button id="dur-10" onclick="setDuration(10)" class="btn-opt">10 min</button>
                    <button id="dur-15" onclick="setDuration(15)" class="btn-opt">15 min</button>
                </div>
                <p>BODIES</p>
                <div class="btn-group">
                    <button id="cnt-1" onclick="setCount(1)" class="btn-opt">1 BODY</button>
                    <button id="cnt-2" onclick="setCount(2)" class="btn-opt">2 BODIES</button>
                    <button id="cnt-3" onclick="setCount(3)" class="btn-opt">3 BODIES</button>
                </div>
                <button onclick="resetSystem()" style="width: 100%; padding: 10px; border: 1px solid #ff4d4d; color: #ff4d4d; background: none;">RESET</button>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
