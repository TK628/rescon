<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUDGE MODE - Dummy System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="master-maintenance-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:20000; display:none; flex-direction:column; align-items:center; justify-content:center; color:#ff4d4d; font-family:sans-serif; text-align:center;">
        <div style="border:1px solid #ff4d4d; padding:30px; background:rgba(255,0,0,0.05);">
            <h1 style="font-size:2rem; letter-spacing:3px;">SYSTEM MAINTENANCE</h1>
            <p style="margin-top:20px;">管理者によりシステム全体が停止されています。</p>
            <button onclick="location.href='index.html'" style="margin-top:20px; color:white; background:none; border:1px solid white; padding:10px; cursor:pointer;">トップへ戻る</button>
        </div>
    </div>
    <div id="auth-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:sans-serif;">
        <h2 id="auth-title">ROOM SETUP</h2>
        <div id="setup-fields" style="display:none; text-align:center;">
            <p>4桁のパスコードを設定してください<br><span style="font-size:12px; color:gray;">（空欄でフリーモード）</span></p>
            <input type="text" id="set-pass" maxlength="4" placeholder="1234" style="padding:10px; font-size:24px; text-align:center; width:120px; background:rgba(255,255,255,0.1); border:1px solid white; color:white; margin-bottom:20px;">
            <p>審判の最大人数を選択</p>
            <select id="set-capacity" style="padding:10px; margin-bottom:20px; width:140px; background:#333; color:white;">
                <option value="1">1名 (専属)</option>
                <option value="2">2名 (共同)</option>
            </select><br>
            <button onclick="setupRoom()" class="btn btn-primary" style="background:#7cfc00; color:black; font-weight:bold;">CREATE ROOM</button>
        </div>
        <div id="login-fields" style="display:none; text-align:center;">
            <p id="login-msg">パスコードを入力してください</p>
            <input type="password" id="input-pass" maxlength="4" style="padding:10px; font-size:24px; text-align:center; width:120px; background:rgba(255,255,255,0.1); border:1px solid white; color:white; margin-bottom:20px;"><br>
            <button onclick="checkPass()" class="btn btn-primary" style="background:#7cfc00; color:black; font-weight:bold;">ACCESS UNLOCK</button>
        </div>
        <p id="error-msg" style="color:#ff4d4d; margin-top:15px; display:none;"></p>
        <button onclick="location.href='index.html'" style="margin-top:40px; background:none; border:none; color:gray; cursor:pointer; text-decoration:underline;">← BACK TO SELECTION</button>
    </div>
    <div class="container">
        <div class="header">
            <div class="status-bar">
                <span class="status-label">STATUS</span>
                <span class="status-value">CONNECTED</span>
                <span class="status-label" style="margin-left:20px;">SYNC</span>
                <span class="status-value">REALTIME</span>
            </div>
            <h1 class="title">JUDGE CONTROL</h1>
        </div>

        <div class="control-panel">
            <div class="panel-row">
                <button id="start-btn" class="btn btn-primary" onclick="toggleTimer()">START</button>
                <button class="btn btn-danger" onclick="resetSystem()">RESET ALL</button>
            </div>
            <div class="panel-row" style="margin-top:15px;">
                <label>ACTIVE UNITS:</label>
                <select onchange="setCount(this.value)" class="sao-select">
                    <option value="1">1 UNIT</option>
                    <option value="2">2 UNITS</option>
                    <option value="3" selected>3 UNITS</option>
                </select>
                <label style="margin-left:15px;">TIME:</label>
                <select onchange="setDuration(this.value)" class="sao-select">
                    <option value="5">5 MIN</option>
                    <option value="10" selected>10 MIN</option>
                    <option value="20">20 MIN</option>
                </select>
            </div>
        </div>

        <div id="countdown-display" style="text-align: center; font-size: 3rem; font-family: 'Courier New', Courier, monospace; margin: 20px 0;">10:00</div>

        <div id="unit-controls">
            <div class="unit-card" id="unit-1">
                <div class="unit-info">
                    <span class="unit-name">UNIT_01</span>
                    <div class="hp-bar-container">
                        <div id="d1-fill" class="hp-fill"></div>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-dmg" onclick="applyDmg('d1', 10, false)">DMG 10</button>
                    <button class="btn btn-dmg" onclick="applyDmg('d1', 30, false)">DMG 30</button>
                    <button class="btn btn-speed" onclick="applyDmg('d1', 0, true)">SPEED UP</button>
                </div>
            </div>

            <div class="unit-card" id="unit-2">
                <div class="unit-info">
                    <span class="unit-name">UNIT_02</span>
                    <div class="hp-bar-container">
                        <div id="d2-fill" class="hp-fill"></div>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-dmg" onclick="applyDmg('d2', 10, false)">DMG 10</button>
                    <button class="btn btn-dmg" onclick="applyDmg('d2', 30, false)">DMG 30</button>
                    <button class="btn btn-speed" onclick="applyDmg('d2', 0, true)">SPEED UP</button>
                </div>
            </div>

            <div class="unit-card" id="unit-3">
                <div class="unit-info">
                    <span class="unit-name">UNIT_03</span>
                    <div class="hp-bar-container">
                        <div id="d3-fill" class="hp-fill"></div>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-dmg" onclick="applyDmg('d3', 10, false)">DMG 10</button>
                    <button class="btn btn-dmg" onclick="applyDmg('d3', 30, false)">DMG 30</button>
                    <button class="btn btn-speed" onclick="applyDmg('d3', 0, true)">SPEED UP</button>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="index.html" style="color: white; text-decoration: none; font-size: 0.8rem; border: 1px solid white; padding: 5px 15px;">BACK TO MENU</a>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
