<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>審判コンソール - ダミー人形ライフ管理システム</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: black; margin: 0; color: white; font-family: sans-serif; }
        #auth-overlay, #master-maintenance-overlay, #game-content { display: none; }
        #master-maintenance-overlay, #auth-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; 
            background:#000; z-index:20000; display:none;
            flex-direction:column; align-items:center; justify-content:center; text-align:center;
        }
        #master-maintenance-overlay { color:#ff4d4d; }
        input, select { background: rgba(255,255,255,0.1); border: 1px solid white; color: white; padding: 10px; margin: 10px; font-size: 20px; }
        .btn-primary { background: #7cfc00; color: black; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .unit-card { border: 1px solid #555; padding: 15px; margin-bottom: 15px; }
        .btn-dmg { padding: 5px 15px; background: #444; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div id="master-maintenance-overlay">
        <div style="border:1px solid #ff4d4d; padding:30px; background:rgba(255,0,0,0.1); border-radius:10px;">
            <h1>SYSTEM MAINTENANCE</h1>
            <p>管理者により全機能がロックされています。</p>
            <button onclick="location.href='index.html'" style="color:white; background:none; border:1px solid white; padding:10px 20px;">TOPページへ</button>
        </div>
    </div>

    <div id="auth-overlay">
        <h2 id="auth-title">JUDGE AUTHENTICATION</h2>
        <div id="setup-fields" style="display:none; text-align:center;">
            <p>部屋の4桁パスコードを設定してください</p>
            <input type="text" id="set-pass" maxlength="4" placeholder="1234">
            <p>審判の最大人数を選択</p>
            <select id="set-capacity">
                <option value="1">1名 (専属)</option>
                <option value="2">2名 (共同)</option>
                <option value="5">5名 (グループ)</option>
                <option value="99">無制限</option>
            </select><br>
            <button onclick="setupRoom()" class="btn-primary">部屋を作成して開始</button>
        </div>
        <div id="login-fields" style="display:none; text-align:center;">
            <p id="login-msg">パスコードを入力してください</p>
            <input type="password" id="input-pass" maxlength="4"><br>
            <button onclick="checkPass()" class="btn-primary">UNLOCK</button>
        </div>
        <p id="error-msg" style="color:#ff4d4d; display:none;"></p>
        <button onclick="location.href='index.html'" style="margin-top:40px; background:none; border:none; color:gray; cursor:pointer;">← ルーム選択に戻る</button>
    </div>

    <div id="game-content">
        <div class="container">
            <h1 style="text-align: center; color: #7cfc00;">JUDGE CONSOLE</h1>
            <div style="text-align: center; margin-bottom: 20px;">
                <div id="countdown-display" style="font-size: 3rem; font-family: monospace;">10:00</div>
                <div style="margin-top: 10px; display: flex; gap: 10px; justify-content: center;">
                    <button id="start-btn" onclick="toggleTimer()" class="btn" style="width: 100px; font-weight: bold; background: #7cfc00;">START</button>
                    <button onclick="resetSystem()" class="btn" style="background: #444; color: white;">RESET ALL</button>
                </div>
            </div>
            <div id="units">
                <div id="unit-1" class="unit-card">
                    <div id="d1-val">250 / 250 LV: 1</div>
                    <div style="background: #222; height: 10px; width: 100%;"><div id="d1-fill" style="background: #7cfc00; height: 100%; width: 94%;"></div></div>
                    <div style="margin-top: 10px;"><button onclick="applyDmg('d1', 4)" class="btn-dmg">DMG 10</button></div>
                </div>
                <div id="unit-2" class="unit-card">
                    <div id="d2-val">250 / 250 LV: 1</div>
                    <div style="background: #222; height: 10px; width: 100%;"><div id="d2-fill" style="background: #7cfc00; height: 100%; width: 94%;"></div></div>
                    <div style="margin-top: 10px;"><button onclick="applyDmg('d2', 4)" class="btn-dmg">DMG 10</button></div>
                </div>
                <div id="unit-3" class="unit-card">
                    <div id="d3-val">250 / 250 LV: 1</div>
                    <div style="background: #222; height: 10px; width: 100%;"><div id="d3-fill" style="background: #7cfc00; height: 100%; width: 94%;"></div></div>
                    <div style="margin-top: 10px;"><button onclick="applyDmg('d3', 4)" class="btn-dmg">DMG 10</button></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
