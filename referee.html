<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>審判コンソール</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: black; margin: 0; color: white; font-family: sans-serif; }
        #auth-overlay, #master-maintenance-overlay, #game-content { display: none; }
        
        #master-maintenance-overlay, #auth-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; 
            background:#000; z-index:20000; display:none;
            flex-direction:column; align-items:center; justify-content:center; text-align:center;
        }

        /* ★セレクトボックスの視認性修正 */
        input, select { 
            background: rgba(255,255,255,0.1); 
            border: 1px solid white; 
            color: white; 
            padding: 10px; 
            margin: 10px; 
            font-size: 20px; 
            border-radius: 4px;
        }
        /* 選択肢（option）の文字を確実に黒にする */
        select option {
            background-color: #333;
            color: white;
        }

        .btn-primary { background: #7cfc00; color: black; border: none; padding: 15px 30px; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 1.1rem; }
        
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .unit-card { border: 1px solid #333; padding: 20px; margin-bottom: 20px; background: rgba(255,255,255,0.05); border-radius: 5px; }
        
        .control-panel { background: #111; border: 1px solid #444; padding: 20px; border-radius: 8px; margin-top: 30px; }
        .panel-label { color: #888; font-size: 12px; margin-bottom: 10px; border-left: 3px solid #7cfc00; padding-left: 10px; }
        
        .btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .btn-opt { background: #222; border: 1px solid #555; color: white; padding: 12px 5px; cursor: pointer; border-radius: 4px; font-size: 14px; transition: 0.2s; }
        .btn-opt.active { background: #7cfc00; color: black; border-color: #7cfc00; font-weight: bold; }

        .btn-dmg { padding: 12px; background: #333; color: white; border: 1px solid #555; cursor: pointer; flex: 1; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="master-maintenance-overlay">
        <div style="border:1px solid #ff4d4d; padding:30px; background:rgba(255,0,0,0.1); border-radius:10px;">
            <h1>SYSTEM MAINTENANCE</h1>
            <p>管理者により全機能がロックされています。</p>
            <button onclick="location.href='index.html'" style="color:white; background:none; border:1px solid white; padding:10px 20px;">TOPページへ</button>
        </div>
    </div>

    <div id="auth-overlay">
        <h2 id="auth-title">JUDGE AUTHENTICATION</h2>
        <div id="setup-fields" style="display:none; text-align:center;">
            <p>4桁のパスコードを設定してください</p>
            <input type="text" id="set-pass" maxlength="4" placeholder="1234">
            <p>審判の最大人数を選択</p>
            <select id="set-capacity">
                <option value="1">1名</option>
                <option value="2">2名</option>
            </select><br>
            <button onclick="setupRoom()" class="btn-primary">部屋を作成して開始</button>
        </div>
        <div id="login-fields" style="display:none; text-align:center;">
            <p id="login-msg">パスコードを入力してください</p>
            <input type="password" id="input-pass" maxlength="4"><br>
            <button onclick="checkPass()" class="btn-primary">UNLOCK</button>
        </div>
        <button onclick="location.href='index.html'" style="margin-top:40px; background:none; border:none; color:gray; cursor:pointer;">← 戻る</button>
    </div>

    <div id="game-content">
        <div class="container">
            <h1 style="text-align: center; color: #7cfc00; letter-spacing: 2px;">JUDGE CONSOLE</h1>
            <div style="text-align: center; margin-bottom: 30px;">
                <div id="countdown-display" style="font-size: 4rem; font-family: monospace; text-shadow: 0 0 10px #7cfc00;">10:00</div>
                <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                    <button id="start-btn" onclick="toggleTimer()" style="width: 150px; padding: 15px; font-weight: bold; border-radius: 30px; border: none; cursor: pointer; font-size: 1.2rem;">START</button>
                </div>
            </div>

            <div id="units">
                <div id="unit-1" class="unit-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><span>DUMMY 01</span><span id="d1-val">250 / 250</span></div>
                    <div style="background: #000; height: 12px; width: 100%; border-radius: 6px; overflow: hidden; margin-bottom: 15px; border: 1px solid #444;"><div id="d1-fill" style="background: #7cfc00; height: 100%; width: 94%; transition: 0.3s;"></div></div>
                    <div style="display: flex; gap: 10px;"><button onclick="applyDmg('d1', 4)" class="btn-dmg">DMG 10</button><button onclick="applyDmg('d1', 20)" class="btn-dmg" style="border-color: #ff4d4d; color: #ff4d4d;">DMG 50</button></div>
                </div>
                <div id="unit-2" class="unit-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><span>DUMMY 02</span><span id="d2-val">250 / 250</span></div>
                    <div style="background: #000; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 15px; border: 1px solid #444;"><div id="d2-fill" style="background: #7cfc00; height: 100%; width: 94%;"></div></div>
                    <div style="display: flex; gap: 10px;"><button onclick="applyDmg('d2', 4)" class="btn-dmg">DMG 10</button><button onclick="applyDmg('d2', 20)" class="btn-dmg" style="border-color: #ff4d4d; color: #ff4d4d;">DMG 50</button></div>
                </div>

                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><span>DUMMY 03</span><span id="d3-val">250 / 250</span></div>
