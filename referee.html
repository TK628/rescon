<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レフリーコンソール - モニター設定</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: black; margin: 0; color: white; font-family: sans-serif; overflow-x: hidden; }
        #auth-overlay, #master-maintenance-overlay, #game-content { display: none; }
        
        /* 斜めに流れる水色のサイバーグリッド線（背景） */
        .cyber-bg-effect {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotate(15deg);
            animation: grid-move-cyan 20s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        /* システムメンテナンス画面 */
        #master-maintenance-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20000;
            display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }

        /* レフリーログイン画面全体のレイアウト */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle, #00151a 0%, #000000 100%);
            z-index: 20000;
            display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }

        /* 面取りサイバーガラスのメインコントロールボックス */
        .login-box {
            position: relative; z-index: 5;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.02) 0%, rgba(0, 150, 255, 0.05) 100%);
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.1);
            padding: 40px 30px; border-radius: 6px; width: 85%; max-width: 380px;
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        .login-box h2 {
            font-size: 1.8rem; letter-spacing: 4px; color: #00ffff; margin: 0 0 15px 0; font-family: monospace;
            text-shadow: 0 0 10px #00ffff, 0 0 20px rgba(0, 255, 255, 0.5);
            animation: blink-cyan 3s infinite alternate;
        }

        .login-box p { color: #b3f7f7; font-size: 13px; margin: 0 0 25px 0; letter-spacing: 1px; text-shadow: 0 0 4px rgba(0,255,255,0.3); line-height: 1.5; }

        .setup-label {
            display: block;
            text-align: left;
            font-size: 12px;
            color: #00ffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 入力フォーム・選択メニュー群 */
        input, select { 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid #00ffff; 
            color: #fff; 
            padding: 12px; 
            font-size: 18px; 
            text-align: center; 
            outline: none; 
            box-shadow: 0 0 10px rgba(0,255,255,0.15); 
            border-radius: 4px;
            width: 100%;
            max-width: 280px;
            box-sizing: border-box;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        input:focus, select:focus { box-shadow: 0 0 18px #00ffff; border-color: #fff; }
        select { text-align-last: center; cursor: pointer; }
        select option { background: #111; color: #fff; }

        /* パスコード専用 */
        input[type="password"], #real-pass-input {
            font-size: 22px;
            letter-spacing: 8px;
            max-width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 統一感のある半透明ネオンガラスボタン */
        .btn-primary { 
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1) 0%, rgba(0, 150, 255, 0.2) 100%); 
            color: #b3f7f7; 
            border: 1px solid #00ffff; 
            padding: 14px 40px; 
            font-size: 16px;
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            box-shadow: 0 0 10px rgba(0,255,255,0.2); 
            border-radius: 4px;
            letter-spacing: 2px;
            width: 100%;
            max-width: 280px;
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.25) 0%, rgba(0, 150, 255, 0.35) 100%); 
            box-shadow: 0 0 20px #00ffff; color: #fff; 
            text-shadow: 0 0 8px #00ffff;
        }

        .login-warning-text {
            font-size: 11px !important;
            color: #ffaa00 !important;
            border-top: 1px dashed rgba(0, 255, 255, 0.2);
            padding-top: 15px;
            margin-top: 25px !important;
            margin-bottom: 0 !important;
            text-shadow: 0 0 4px rgba(255, 170, 0, 0.4) !important;
            text-align: center;
            line-height: 1.6;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; position: relative; z-index: 5; }
        .back-link { position: relative; z-index: 10; margin-top: 30px; background: none; color: #005555; border: none; cursor: pointer; text-decoration: underline; font-size: 14px; transition: 0.2s; }
        .back-link:hover { color: #00ffff; text-shadow: 0 0 5px #00ffff; }

        @keyframes grid-move-cyan { 0% { transform: rotate(15deg) translateY(0); } 100% { transform: rotate(15deg) translateY(40px); } }
        @keyframes blink-cyan { 0%, 90%, 94%, 98%, 100% { opacity: 1; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; } 92%, 96% { opacity: 0.3; text-shadow: none; } }
    </style>
</head>
<body>
    <div class="cyber-bg-effect"></div>

    <div id="master-maintenance-overlay">
        <h1>SYSTEM MAINTENANCE</h1><p>現在一斉メンテナンス中です。</p>
        <button onclick="location.href='index.html'" style="color:white; border:1px solid white; background:none; padding:10px;">戻る</button>
    </div>

    <div id="auth-overlay">
        <div id="login-fields" style="display:none !important;">
            <input type="password" id="input-pass">
            <select id="referee-count-select"><option value="1"></option></select>
        </div>
        <div id="config-fields" style="display:none !important;"></div>

        <div class="login-box">
            <h2>REFEREE CONSOLE</h2>
            <p>設定する4桁のパスコードを入力してください。空欄のまま作成するとパスワードなしになります。</p>
            
            <span class="setup-label" style="text-align: center;">ROOM PASSCODE</span>
            <input type="password" id="real-pass-input" maxlength="4" placeholder="任意入力">

            <span class="setup-label" style="text-align: center;">REFEREE ACCESS LIMIT</span>
            <select id="real-count-select">
                <option value="1">1名 (主審のみ)</option>
                <option value="2">2名 (主審 + 副審)</option>
                <option value="3">3名 (主審 + 副審2名)</option>
                <option value="4">4名 (最大構成)</option>
            </select>

            <button onclick="executeRoomCreation()" class="btn-primary">CREATE ROOM</button>
            
            <p class="login-warning-text">
                [ REFEREE AUTHORITY ]<br>
                ルームの構築が完了すると、選手モニターとのデータリンクプロトコルが自動的に同期を開始します。
            </p>
        </div>
        
        <button onclick="location.href='index.html'" class="back-link">← ルーム選択に戻る</button>
    </div>

    <div id="game-content">
        <div class="container">
            <p style="text-align:center; color:#555; font-size:12px; margin-top:50px;">REFEREE CONTROL PANEL ACTIVE</p>
            <button onclick="location.href='index.html'" class="back-link" style="display:block; margin:40px auto 0 auto; color:#444;">← EXIT CONSOLE</button>
        </div>
    </div>

    <script type="module">
        import { getDatabase } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.db) {
                    console.log("Referee database pipeline synced.");
                } else {
                    try { window.db = getDatabase(); } catch(e){}
                }
            }, 500);
        });

        // 🚀 本物の画面で入力された文字（または空）をダミーに渡して、確実に元の認証関数を呼び出す
        window.executeRoomCreation = () => {
            const realPass = document.getElementById('real-pass-input').value;
            const realCount = document.getElementById('real-count-select').value;

            const dummyPass = document.getElementById('input-pass');
            const dummySelect = document.getElementById('referee-count-select');

            if (dummyPass) {
                dummyPass.value = realPass;
            }
            
            if (dummySelect) {
                let hasOption = false;
                for (let i = 0; i < dummySelect.options.length; i++) {
                    if (dummySelect.options[i].value == realCount) { hasOption = true; break; }
                }
                if (!hasOption) {
                    const opt = document.createElement('option');
                    opt.value = realCount;
                    opt.innerText = realCount;
                    dummySelect.appendChild(opt);
                }
                dummySelect.value = realCount;
            }

            // 元々のapp.js側にあるパスワードチェック（認証）関数を100%確実にトリガー
            if (typeof window.checkPass === "function") {
                window.checkPass();
            } else {
                console.log("Bridge complete. System waiting for input match.");
            }
        };
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
