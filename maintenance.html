<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title id="maint-title">警告：システムメンテナンス中 | 管理特権ロック</title>
<style>
        html, body {
            background-color: #000000; background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); color: #ff3333; margin: 0; padding: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; font-family: 'Courier New', Courier, monospace; text-align: center; overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background-image: linear-gradient(rgba(255, 0, 0, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 0, 0.03) 1px, transparent 1px); background-size: 40px 40px; transform: rotate(15deg); animation: grid-move 20s linear infinite; z-index: 1; pointer-events: none;
        }
        .maint-wrapper { max-width: 600px; width: 90%; margin: 40px auto 40px auto; position: relative; z-index: 2; }

        .info-panel { 
            margin: 0 0 20px 0; background: rgba(255, 0, 0, 0.02) !important; border: 1px solid #ff3333 !important; border-radius: 4px; padding: 15px; text-align: left; box-shadow: 0 0 15px rgba(255, 51, 51, 0.4), inset 0 0 10px rgba(255, 51, 51, 0.05) !important; max-height: 180px; min-height: 90px; overflow-y: auto; box-sizing: border-box;
        }
        .info-panel::-webkit-scrollbar { width: 6px; }
        .info-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .info-panel::-webkit-scrollbar-thumb { background: #ff3333 !important; border-radius: 3px; box-shadow: 0 0 5px #ff3333 !important; }

        .news-item { border-bottom: 1px dashed rgba(255, 51, 51, 0.3) !important; padding-bottom: 12px; margin-bottom: 12px; }
        .news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .news-item.is-pinned { border-bottom: 1px solid #ffaa00 !important; background: rgba(255, 170, 0, 0.03); margin-bottom: 15px; padding-bottom: 15px; }
        .info-header { color: #ff3333 !important; font-size: 0.75rem; letter-spacing: 2px; margin-bottom: 6px; display: flex; justify-content: space-between; text-shadow: 0 0 5px rgba(255, 51, 51, 0.8) !important; }
        .is-pinned .info-header { color: #ffaa00 !important; text-shadow: 0 0 5px rgba(255, 170, 0, 0.6) !important; }
        .info-header .badge { background: rgba(255, 255, 255, 0.1); padding: 1px 5px; border-radius: 3px; font-size: 9px; margin-left: 5px; }
        .info-header .badge.pinned-post { color: #ffaa00; border: 1px solid #ffaa00; box-shadow: 0 0 4px #ffaa00; background: rgba(255,170,0,0.1); }

        .info-content { color: #ffcccc; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; font-family: 'Verdana', sans-serif; }

        .report-panel {
            background: rgba(40, 0, 0, 0.2) !important; border: 1px solid #ff3333 !important; border-radius: 4px; padding: 10px 15px; margin-bottom: 30px; text-align: left; box-shadow: 0 0 12px rgba(255, 51, 51, 0.2), inset 0 0 8px rgba(255, 51, 51, 0.03) !important; display: flex; gap: 10px; align-items: center; box-sizing: border-box;
        }
        .report-input { flex: 1; background: #000 !important; border: 1px solid rgba(255, 51, 51, 0.4) !important; color: #ffffff !important; padding: 8px; font-size: 13px; border-radius: 4px; outline: none; text-shadow: 0 0 3px rgba(255,51,51,0.2); font-family: 'Verdana', sans-serif; }
        .report-input::placeholder { color: rgba(255, 51, 51, 0.3) !important; }
        .report-input:focus { border-color: #ff3333 !important; box-shadow: 0 0 10px rgba(255, 51, 51, 0.4) !important; }
        .btn-report-send { background: linear-gradient(135deg, rgba(255, 51, 51, 0.15) 0%, rgba(180, 0, 0, 0.25) 100%) !important; color: #ff9999 !important; border: 1px solid #ff3333 !important; padding: 8px 16px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; text-shadow: 0 0 5px #ff3333 !important; font-family: 'Verdana', sans-serif; }
        .btn-report-send:hover { background: rgba(255, 51, 51, 0.3) !important; box-shadow: 0 0 12px #ff3333 !important; color: #fff !important; }

        .m-box { border: 2px solid #ff3333; padding: 30px 40px; background: rgba(20, 0, 0, 0.85); box-shadow: 0 0 30px rgba(255, 51, 51, 0.6), inset 0 0 20px rgba(255, 51, 51, 0.3); border-radius: 4px; backdrop-filter: blur(5px); }
        .m-box h1 { font-size: 2.6rem; margin: 0 0 12px 0; letter-spacing: 6px; color: #ff3333; text-shadow: 0 0 10px #ff3333, 0 0 20px #ff3333; animation: blink 2s infinite alternate; }
        .m-box p { font-size: 1.1rem; color: #ff9999; letter-spacing: 2px; margin: 0; text-shadow: 0 0 5px rgba(255, 51, 51, 0.5); }
        .m-sub-text { margin-top: 20px; font-size: 0.8rem; color: #660000; letter-spacing: 1px; text-transform: uppercase; animation: pulse 1s infinite alternate; }

        .admin-trigger { position: fixed; bottom: 10px; right: 10px; opacity: 0.1; cursor: pointer; color: white; font-size: 10px; z-index: 30000; padding: 15px; text-decoration: none; }
        .admin-trigger:hover { opacity: 0.2; }

        @keyframes grid-move { 0% { transform: rotate(15deg) translateY(0); } 100% { transform: rotate(15deg) translateY(40px); } }
        @keyframes blink { 0%, 90%, 94%, 98%, 100% { opacity: 1; text-shadow: 0 0 10px #ff3333, 0 0 20px #ff3333; } 92%, 96% { opacity: 0.3; text-shadow: none; } }
        @keyframes pulse { 0% { color: #550000; } 100% { color: #ff0000; text-shadow: 0 0 5px #ff0000; } }
    </style>
</head>
<body>
<div class="maint-wrapper">
<div class="info-panel" id="board-container">
<div id="board-inner">お知らせを同期中...</div>
</div>
<div class="report-panel" id="report-form-panel">
<input class="report-input" id="report-text" placeholder="運営宛てに状況確認・メッセージを入力..." type="text"/>
<button class="btn-report-send" id="btn-send-report">送信</button>
</div>
<div class="m-box">
<h1>WARNING</h1>
<p>SYSTEM UNDER MAINTENANCE</p>
<div style="font-size: 0.9rem; margin-top: 10px; color: #ff5555; opacity: 0.8;">全てのルームへのアクセスが一時的に制限されています。</div>
<div class="m-sub-text">◈ CODE: ACCESS_DENIED_BY_ADMIN ◈</div>
</div>
</div>
<a class="admin-trigger" href="owner.html">MASTER ACCESS</a>

<script src="./js/maintenance.js" type="module"></script></body>
</html>
