<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダミー人形ライフ管理システム</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .room-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .room-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid white;
            color: white;
            padding: 15px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            transition: 0.3s;
            position: relative;
        }
        .room-btn:hover { background: white; color: black; }
        
        /* 使用中（Online）のバッジ */
        .online-badge {
            position: absolute;
            top: 2px;
            right: 5px;
            font-size: 10px;
            color: #7cfc00;
            display: none; /* デフォルトは非表示 */
        }
        .room-btn.active .online-badge { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-top: 30px;">SELECT ROOM</h1>
        
        <div class="room-grid" id="room-list">
            <!-- JavaScriptでルームを生成します -->
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <p id="selected-room-display">ルームを選んでください</p>
            <div id="mode-selection" style="display: none; gap: 10px; justify-content: center; margin-top: 10px;">
                <button onclick="goToPage('referee.html')" class="btn btn-primary">JUDGE</button>
                <button onclick="goToPage('player.html')" class="btn btn-secondary">PLAYER</button>
            </div>
        </div>
    </div>

    <script type="module">
        let currentRoom = "";

        // 10個のルームを生成
        const roomList = document.getElementById('room-list');
        for (let i = 1; i <= 10; i++) {
            const btn = document.createElement('div');
            btn.className = 'room-btn';
            btn.innerHTML = `ROOM ${i.toString().padStart(2, '0')}<span class="online-badge">● ONLINE</span>`;
            btn.onclick = () => selectRoom(i);
            roomList.appendChild(btn);
        }

        function selectRoom(id) {
            currentRoom = "room" + id;
            document.getElementById('selected-room-display').innerText = `ROOM ${id} を選択中`;
            document.getElementById('mode-selection').style.display = 'flex';
            
            // 全ボタンの選択状態を解除
            document.querySelectorAll('.room-btn').forEach(b => b.style.background = "");
            event.target.style.background = "rgba(255,255,255,0.4)";
        }

        window.goToPage = (page) => {
            if (!currentRoom) return;
            // URLパラメータとしてルームIDを渡す (例: referee.html?room=room1)
            window.location.href = `${page}?room=${currentRoom}`;
        };
    </script>
</body>
</html>
