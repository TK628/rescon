<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>ダミー人形ライフ管理システム | ひだまりPJ</title>
    <meta name="description" content="リアルタイムでダミー人形のライフ（HP）や残り時間を管理・同期できる、SAO風サイバーデザインのトレーニング・ゲーム用管理システムです。">
    <meta name="keywords" content="ダミー人形, ライフ管理, タイマー同期, Firebase, SAO風UI, ひだまり">

    <link rel="stylesheet" href="style.css">
    <style>
        #main-container { display: none; }
        
        /* サイバーメンテナンス画面 */
        #main-maintenance-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a0000 0%, #000000 100%);
            color: #ff3333; z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Courier New', Courier, monospace; text-align: center;
            overflow: hidden;
        }

        #main-maintenance-overlay::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotate(15deg);
            animation: grid-move 20s linear infinite;
            z-index: 1;
        }

        .m-box { 
            position: relative; z-index: 2;
            border: 2px solid #ff3333; 
            padding: 40px 60px; 
            background: rgba(20, 0, 0, 0.85); 
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.6), inset 0 0 20px rgba(255, 51, 51, 0.3); 
            border-radius: 4px; 
            backdrop-filter: blur(5px);
        }

        .m-box h1 {
            font-size: 2.8rem;
            margin: 0 0 15px 0;
            letter-spacing: 6px;
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333, 0 0 20px #ff3333;
            animation: blink 2s infinite alternate;
        }

        .m-box p {
            font-size: 1.1rem;
            color: #ff9999;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }

        .m-sub-text {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #660000;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulse 1s infinite alternate;
        }

        .admin-trigger { 
            position: fixed; bottom: 10px; right: 10px; opacity: 0.1; cursor: pointer; 
            color: white; font-size: 10px; z-index: 30000; padding: 15px; 
        }

        /* 掲示板パネル */
        .info-panel { 
            margin: 10px 0 15px 0; 
            background: rgba(124, 252, 0, 0.01); 
            border: 1px solid #7cfc00; 
            border-radius: 4px; 
            padding: 15px; 
            text-align: left; 
            box-shadow: 0 0 15px rgba(124, 252, 0, 0.3), inset 0 0 10px rgba(124, 252, 0, 0.05);
            max-height: 180px;
            overflow-y: auto;
            position: relative;
            z-index: 20000;
            transition: all 0.5s ease;
        }
        
        .info-panel::-webkit-scrollbar { width: 6px; }
        .info-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .info-panel::-webkit-scrollbar-thumb { background: #7cfc00; border-radius: 3px; box-shadow: 0 0 5px #7cfc00; }

        .info-panel.in-maintenance {
            background: rgba(255, 0, 0, 0.02) !important;
            border: 1px solid #ff3333 !important;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4), inset 0 0 10px rgba(255, 51, 51, 0.05) !important;
        }
        .info-panel.in-maintenance::-webkit-scrollbar-thumb { background: #ff3333 !important; box-shadow: 0 0 5px #ff3333 !important; }
        .info-panel.in-maintenance .info-header { color: #ff3333 !important; text-shadow: 0 0 5px rgba(255, 51, 51, 0.8) !important; }

        .update-board-link {
            position: absolute; top: 12px; right: 15px; font-size: 10px; font-weight: bold;
            color: #7cfc00; text-decoration: none; border: 1px solid #7cfc00; padding: 2px 8px;
            border-radius: 3px; background: rgba(0,0,0,0.6); box-shadow: 0 0 5px rgba(124,252,0,0.3);
            cursor: pointer; letter-spacing: 1px; transition: all 0.2s ease; z-index: 21000;
        }
        .update-board-link:hover { background: #7cfc00; color: #000; box-shadow: 0 0 10px #7cfc00; }
        .info-panel.in-maintenance .update-board-link { color: #ff3333 !important; border-color: #ff3333 !important; box-shadow: 0 0 5px rgba(255,51,51,0.3) !important; }
        .info-panel.in-maintenance .update-board-link:hover { background: #ff3333 !important; color: #000 !important; box-shadow: 0 0 10px #ff3333 !important; }

        .news-item { border-bottom: 1px dashed rgba(124, 252, 0, 0.2); padding-bottom: 12px; margin-bottom: 12px; }
        .info-panel.in-maintenance .news-item { border-bottom: 1px dashed rgba(255, 51, 51, 0.3) !important; }
        .news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .news-item.is-pinned { border-bottom: 1px solid #ffaa00; background: rgba(255, 170, 0, 0.03); margin-bottom: 15px; padding-bottom: 15px; }

        .info-header { color: #7cfc00; font-size: 0.75rem; letter-spacing: 2px; margin-bottom: 6px; display: flex; justify-content: space-between; text-shadow: 0 0 5px rgba(124, 252, 0, 0.6); padding-right: 90px; }
        .is-pinned .info-header { color: #4c64e7; text-shadow: 0 0 5px rgba(255, 170, 0, 0.6); }

        .info-header .badge { background: rgba(255, 255, 255, 0.1); padding: 1px 5px; border-radius: 3px; font-size: 9px; margin-left: 5px; }
        .info-header .badge.pinned-post { color: #e99ef0; border: 1px solid #e6308b; box-shadow: 0 0 6px #ffbffa; background: rgba(255,170,0,0.1); }
        .info-header .badge.hidden-post { color: #ff4d4d; border: 1px solid #ff4d4d; box-shadow: 0 0 4px #ff4d4d; }
        .info-header .badge.reserve-post { color: #00ffff; border: 1px solid #00ffff; box-shadow: 0 0 4px #00ffff; }

        .info-content { color: #eee; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }

        /* コメント送信フォーム：極美サイバーイエロー（#ffff00）仕様 */
        .report-panel {
            background: rgba(40, 40, 0, 0.15) !important; border: 1px solid #ffff00 !important; border-radius: 4px; padding: 10px 15px;
            margin-bottom: 25px; text-align: left; box-shadow: 0 0 12px rgba(255, 255, 0, 0.2), inset 0 0 8px rgba(255, 255, 0, 0.03) !important; position: relative; z-index: 20000; display: flex; gap: 10px; align-items: center;
        }
        .report-input { flex: 1; background: #000 !important; border: 1px solid rgba(255, 255, 0, 0.4) !important; color: #ffffff !important; padding: 8px; font-size: 13px; border-radius: 4px; outline: none; text-shadow: 0 0 3px rgba(255,255,0,0.2); }
        .report-input::placeholder { color: rgba(255, 255, 0, 0.2) !important; }
        .report-input:focus { border-color: #ffff00 !important; box-shadow: 0 0 10px rgba(255, 255, 0, 0.4) !important; }
        .btn-report-send { background: linear-gradient(135deg, rgba(255, 255, 0, 0.12) 0%, rgba(200, 200, 0, 0.22) 100%) !important; color: #ffff00 !important; border: 1px solid #ffff00 !important; padding: 8px 16px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; text-shadow: 0 0 5px #ffff00 !important; }
        .btn-report-send:hover { background: rgba(255, 255, 0, 0.25) !important; box-shadow: 0 0 12px #ffff00 !important; color: #fff !important; }

        .title-logo { text-align: center; margin-top: 10px; letter-spacing: 4px; color: white; font-size: 2rem; text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); }
        .room-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        
        .room-btn { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid #7cfc00; color: #fff; padding: 25px 15px; 
            text-align: center; font-weight: bold; transition: all 0.3s ease; position: relative; cursor: pointer; 
            box-shadow: 0 0 8px rgba(124, 252, 0, 0.15); overflow: hidden;
        }
        .room-btn:hover { background: rgba(124, 252, 0, 0.08); box-shadow: 0 0 15px rgba(124, 252, 0, 0.5); }
        .room-btn.active { 
            border: 2px solid #ff0000 !important; background: #0a0000;
            box-shadow: 0 0 15px #ff0000, 0 0 35px #ff0000, inset 0 0 15px #500 !important;
            animation: room-pulse 1.5s infinite alternate ease-in-out;
        }
        .room-btn.active:hover { box-shadow: 0 0 25px #ff0000, 0 0 55px #ff0000, 0 0 80px #ff0000, inset 0 0 20px #800 !important; }

        .room-btn .smoke-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: 0; transition: 0.5s; }
        .room-btn.active .smoke-layer { opacity: 1; }
        .smoke { position: absolute; background: rgba(255, 0, 0, 0.12); border-radius: 50%; filter: blur(12px); }
        .smoke-1 { width: 80px; height: 80px; top: -20px; left: 10px; animation: smk-move 5s infinite linear; }
        .smoke-2 { width: 90px; height: 90px; bottom: -30px; right: 20px; animation: smk-move 6s infinite linear 1s; }

        .room-title-text { position: relative; z-index: 2; text-shadow: 0 0 5px rgba(255,255,255,0.5); font-size: 1.1rem; letter-spacing: 1px; }
        .room-btn.active .room-title-text { text-shadow: 0 0 8px #ff3333; }

        .online-badge { position: absolute; top: 6px; right: 10px; font-size: 10px; color: #ff0000; display: none; text-shadow: 0 0 5px #ff0000; font-weight: bold; z-index: 2; }
        .offline-badge { position: absolute; top: 6px; right: 10px; font-size: 10px; color: #7cfc00; display: block; text-shadow: 0 0 4px #7cfc00; z-index: 2; }
        .room-btn.active .online-badge { display: block; animation: badge-flash 1s infinite; }
        .room-btn.active .offline-badge { display: none; }
        
        #mode-popup-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 40000; align-items: center; justify-content: center;
        }
        .popup-window {
            background: rgba(15, 15, 15, 0.9); border: 2px solid #7cfc00;
            box-shadow: 0 0 30px rgba(124, 252, 0, 0.4), inset 0 0 15px rgba(124, 252, 0, 0.1);
            width: 85%; max-width: 340px; padding: 25px 20px; border-radius: 8px; text-align: center; box-sizing: border-box; animation: popup-scale 0.2s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        #popup-room-title { font-size: 1.5rem; font-weight: bold; color: #fff; margin: 0 0 20px 0; letter-spacing: 2px; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
        .mode-btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        
        .mode-btn { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; transition: all 0.2s ease; text-align: center; box-sizing: border-box; }
        .btn-judge { background: linear-gradient(135deg, rgba(255, 75, 43, 0.1) 0%, rgba(255, 65, 108, 0.2) 100%); color: #ff9999; border: 1px solid #ff416c; border-left: 6px solid #ff4b2b; box-shadow: 0 0 10px rgba(255, 65, 108, 0.2); text-shadow: 0 0 5px rgba(255, 75, 43, 0.5); }
        .btn-judge:hover { background: linear-gradient(135deg, rgba(255, 75, 43, 0.25) 0%, rgba(255, 65, 108, 0.35) 100%); box-shadow: 0 0 18px rgba(255, 65, 108, 0.6); color: #fff; text-shadow: 0 0 8px #ff4b2b; }
        .btn-player { background: linear-gradient(135deg, rgba(86, 171, 47, 0.1) 0%, rgba(168, 224, 99, 0.2) 100%); color: #bbf099; border: 1px solid #a8e063; border-left: 6px solid #56ab2f; box-shadow: 0 0 10px rgba(168, 224, 99, 0.2); text-shadow: 0 0 5px rgba(86, 171, 47, 0.5); }
        .btn-player:hover { background: linear-gradient(135deg, rgba(86, 171, 47, 0.25) 0%, rgba(168, 224, 99, 0.35) 100%); box-shadow: 0 0 18px rgba(168, 224, 99, 0.6); color: #fff; text-shadow: 0 0 8px #56ab2f; }
        .btn-close-popup { margin-top: 20px; background: rgba(255,255,255,0.02); border: 1px solid #444; color: #777; padding: 10px 20px; font-size: 13px; cursor: pointer; border-radius: 4px; width: 100%; transition: 0.2s; }
        .btn-close-popup:hover { color: #fff; border-color: #888; background: rgba(255,255,255,0.05); }

        @keyframes grid-move { 0% { transform: rotate(15deg) translateY(0); } 100% { transform: rotate(15deg) translateY(40px); } }
        @keyframes blink { 0%, 90%, 94%, 98%, 100% { opacity: 1; text-shadow: 0 0 10px #ff3333, 0 0 20px #ff3333; } 92%, 96% { opacity: 0.3; text-shadow: none; } }
        @keyframes pulse { 0% { color: #550000; } 100% { color: #ff0000; text-shadow: 0 0 5px #ff0000; } }
        @keyframes badge-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes smk-move { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(20px, -20px) scale(1.3); opacity: 0; } }
        @keyframes popup-scale { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes room-pulse {
            0% { box-shadow: 0 0 15px #ff0000, 0 0 35px #ff0000, inset 0 0 15px #500; }
            100% { box-shadow: 0 0 25px #ff0000, 0 0 50px #ff3333, inset 0 0 25px #800; }
        }
    </style>
</head>
<body style="background: black;">
    
    <div id="main-maintenance-overlay">
        <div class="m-box">
            <h1>WARNING</h1>
            <p>SYSTEM UNDER MAINTENANCE</p>
            <div style="font-size: 0.9rem; margin-top: 10px; color: #ff5555; opacity: 0.8;">全てのルームへのアクセスが一時的に制限されています。</div>
            <div class="m-sub-text">◈ CODE: ACCESS_DENIED_BY_ADMIN ◈</div>
        </div>
        <div class="admin-trigger" onclick="location.href='owner.html'">MASTER ACCESS</div>
    </div>

    <div id="main-container" class="container" style="max-width: 600px; margin: 0 auto; padding: 20px; display: block !important;">
        
        <div class="info-panel" id="board-container">
            <a href="updates.html" class="update-board-link">⚡ UPDATE LOG</a>
            <div id="board-inner">お知らせを同期中...</div>
        </div>

        <div class="report-panel" id="report-form-panel">
            <input type="text" id="report-text" class="report-input" placeholder="運営宛てにバグ報告・コメントを入力...">
            <button id="btn-send-report" class="btn-report-send">送信</button>
        </div>

        <div id="maint-hide-wrapper">
            <h1 class="title-logo">SELECT ROOM</h1>
            <div class="room-grid" id="room-list"></div>
        </div>
    </div>
    
    <div id="mode-popup-overlay">
        <div class="popup-window">
            <div id="popup-room-title">ROOM 01</div>
            <div class="mode-btn-group">
                <button onclick="goToPage('referee.html')" class="mode-btn btn-judge">◈ JUDGE MODE</button>
                <button onclick="goToPage('player.html')" class="mode-btn btn-player">◈ PLAYER MODE</button>
                <button onclick="goToPage('spectator.html')" class="mode-btn" style="background: linear-gradient(135deg, rgba(0, 255, 255, 0.05) 0%, rgba(0, 150, 255, 0.15) 100%); color: #00ffff; border: 1px solid rgba(0, 255, 255, 0.4); text-shadow: 0 0 5px #00ffff; box-shadow: 0 0 8px rgba(0,255,255,0.1);">◈ SPECTATOR MODE</button>
            </div>
            <button onclick="closePopup()" class="btn-close-popup">CANCEL</button>
        </div>
    </div>

    <div class="admin-trigger" onclick="location.href='owner.html'">MASTER ACCESS</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, get, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCIBxNvfpaSV3sBS-VKtDob4zYhZJ7djIk",
            authDomain: "hidamari-pj-8b4bb.firebaseapp.com",
            databaseURL: "https://hidamari-pj-8b4bb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hidamari-pj-8b4bb",
            storageBucket: "hidamari-pj-8b4bb.firebasestorage.app",
            messagingSenderId: "293093126367",
            appId: "1:293093126367:web:151cce22308352fa5ff96a",
            measurementId: "G-7NNBEZBNXZ"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const isLocalEnv = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";
        const sysPath = isLocalEnv ? "system_local" : "system";

        // 🎯 Firebaseを開放したので、危険なトークン割込を完全撤去！超シンプル・高速処理
        document.addEventListener('DOMContentLoaded', () => {
            const sendBtn = document.getElementById('btn-send-report');
            if (sendBtn) {
                sendBtn.addEventListener('click', () => {
                    const text = document.getElementById('report-text').value.trim();
                    if (!text) return;

                    const reportRef = push(ref(db, `${sysPath}/bug_reports`));
                    set(reportRef, {
                        text: text,
                        timestamp: Date.now(),
                        date: new Date().toLocaleString()
                    }).then(() => {
                        document.getElementById('report-text').value = "";
                        alert("送信を完了しました。ご協力ありがとうございます！");
                    }).catch(err => {
                        alert("送信エラーが発生しました:\n" + err.message);
                    });
                });
            }
        });

        onValue(ref(db, `${sysPath}/masterMaintenance`), (snap) => {
            const isMaint = snap.val();
            document.getElementById('main-maintenance-overlay').style.display = isMaint ? 'flex' : 'none';
            document.getElementById('maint-hide-wrapper').style.display = isMaint ? 'none' : 'block';
            const boardEl = document.getElementById('board-container');
            if (boardEl) {
                if (isMaint) boardEl.classList.add('in-maintenance');
                else boardEl.classList.remove('in-maintenance');
            }
        });

        setInterval(() => {
            get(ref(db, `${sysPath}/news_list`)).then((snap) => {
                const data = snap.val(); if (!data) return;
                const now = Date.now();
                Object.keys(data).forEach(async (key) => {
                    if (data[key].deleteAt && now > data[key].deleteAt) {
                        await set(ref(db, `${sysPath}/auth_token`), "d6c61b07926d88b2547eec66fb7dcc8df859a4368ef07bce99406dc5d6dd9001");
                        await remove(ref(db, `${sysPath}/news_list/${key}`));
                        await remove(ref(db, `${sysPath}/auth_token`));
                    }
                });
            });
        }, 3000);

        onValue(ref(db, `${sysPath}/news_list`), (snap) => {
            const data = snap.val();
            const container = document.getElementById('board-inner');
            if (!data) {
                container.innerHTML = '<div style="color:#666; text-align:center;">お知らせはありません。</div>';
                return;
            }
            let html = ""; const now = Date.now();
            const keys = Object.keys(data).sort((a, b) => {
                const pinA = data[a].pinned === true ? 1 : 0; const pinB = data[b].pinned === true ? 1 : 0;
                if (pinA !== pinB) return pinB - pinA; return data[b].timestamp - data[a].timestamp;
            });
            keys.forEach(key => {
                const item = data[key];
                if (item.deleteAt && now > item.deleteAt) return;
                if ((item.releaseTime && item.releaseTime > now) || item.hidden === true) return;
                let badgeHtml = ""; if (item.pinned === true) badgeHtml += '<span class="badge pinned-post">📌 PINNED</span>';
                html += `<div class="news-item ${item.pinned === true ? 'is-pinned' : ''}"><div class="info-header"><span>SYSTEM NOTIFICATION ${badgeHtml}</span><span>${item.date}</span></div><div class="info-content">${escapeHTML(item.text)}</div></div>`;
            });
            container.innerHTML = html || '<div style="color:#666; text-align:center;">お知らせはありません。</div>';
        });

        function escapeHTML(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
        window.closePopup = () => { document.getElementById('mode-popup-overlay').style.display = 'none'; };

        let selectedRoom = "";
        const roomList = document.getElementById('room-list');
        for (let i = 1; i <= 10; i++) {
            const roomId = `room${i}`;
            const btn = document.createElement('div'); btn.className = 'room-btn';
            btn.innerHTML = `<div class="smoke-layer"><div class="smoke smoke-1"></div><div class="smoke smoke-2"></div></div><div class="room-title-text">ROOM ${i.toString().padStart(2, '0')}</div><span class="online-badge">● IN USE</span><span class="offline-badge">● EMPTY</span>`;
            btn.onclick = () => { selectedRoom = roomId; document.getElementById('popup-room-title').innerText = `ROOM ${i.toString().padStart(2, '0')}`; document.getElementById('mode-popup-overlay').style.display = 'flex'; };
            roomList.appendChild(btn);
            onValue(ref(db, `rooms/${roomId}/online`), (snapshot) => {
                if (snapshot.val() === true) {
                    btn.classList.add('active');
                    get(ref(db, `rooms/${roomId}/referees`)).then(refSnap => { if (!refSnap.exists()) { remove(ref(db, `rooms/${roomId}/online`)); remove(ref(db, `rooms/${roomId}/config`)); } });
                } else { btn.classList.remove('active'); }
            });
        }
        window.goToPage = (page) => { if (selectedRoom) window.location.href = `${page}?room=${selectedRoom}`; };
    </script>
</body>
</html>
