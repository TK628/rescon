<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title id="site-title">ダミー人形ライフ管理システム | ひだまりPJ</title>
<meta content="リアルタイムでダミー人形のライフ（HP）や残り時間を管理・同期できるシステムです。" name="description"/>
<meta content="ダミー人形, ライフ管理, タイマー同期, ひだまり" name="keywords"/>
<link href="style.css" rel="stylesheet"/>
<style>
        /* 🎨 ひだまりさんのオリジナルCSS、SAOエフェクト、煙アニメーションを100%完全維持 */
        #main-container { display: block; }
        
        #board-container-wrapper {
            position: relative;
            margin: 25px 0 15px 0;
        }

        .admin-trigger { 
            position: fixed; bottom: 10px; right: 10px; opacity: 0.1 !important; cursor: pointer; 
            color: white !important; font-size: 10px !important; z-index: 30000; padding: 15px;
            text-shadow: none !important; box-shadow: none !important; background: none !important;
            font-weight: normal !important; border: none !important;
        }
        .admin-trigger:hover { opacity: 0.15 !important; background: none !important; color: white !important; }

        .info-panel { 
            background: rgba(124, 252, 0, 0.01); 
            border: 1px solid #7cfc00; 
            border-radius: 4px; 
            padding: 15px; 
            text-align: left; 
            box-shadow: 0 0 15px rgba(124, 252, 0, 0.3), inset 0 0 10px rgba(124, 252, 0, 0.05);
            max-height: 180px;
            min-height: 90px;
            overflow-y: auto;
            position: relative;
            z-index: 20000;
            box-sizing: border-box;
            transition: all 0.5s ease;
        }
        
        .info-panel::-webkit-scrollbar { width: 6px; }
        .info-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .info-panel::-webkit-scrollbar-thumb { background: #7cfc00; border-radius: 3px; box-shadow: 0 0 5px #7cfc00; }

        .cyber-board-link {
            position: absolute; top: -23px; font-size: 10px; font-weight: bold;
            color: #7cfc00; text-decoration: none; border: 1px solid #7cfc00; padding: 2px 8px;
            border-radius: 3px 3px 0 0; background: rgba(0,0,0,0.9);
            cursor: pointer; letter-spacing: 1px; transition: all 0.2s ease; z-index: 21000;
            border-bottom: none; display: flex; align-items: center; gap: 4px;
        }
        .cyber-board-link:hover { background: #7cfc00; color: #000; box-shadow: 0 0 10px #7cfc00; }

        .manual-board-link { left: 0; box-shadow: -2px -2px 6px rgba(124,252,0,0.15); }
        .update-board-link { right: 0; box-shadow: 2px -2px 6px rgba(124,252,0,0.15); }
        
        .blue-dot {
            display: none; width: 6px; height: 6px; background-color: #00ffff; 
            border-radius: 50%; box-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff;
            animation: dot-pulse 1.5s infinite alternate ease-in-out;
        }
        @keyframes dot-pulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }

        .news-item { border-bottom: 1px dashed rgba(124, 252, 0, 0.2); padding-bottom: 12px; margin-bottom: 12px; }
        .news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .news-item.is-pinned { border-bottom: 1px solid #ffaa00; background: rgba(255, 170, 0, 0.03); margin-bottom: 15px; padding-bottom: 15px; }

        .info-header { color: #7cfc00; font-size: 0.75rem; letter-spacing: 2px; margin-bottom: 6px; display: flex; justify-content: space-between; text-shadow: 0 0 5px rgba(124, 252, 0, 0.6); }
        .is-pinned .info-header { color: #4c64e7; text-shadow: 0 0 5px rgba(255, 170, 0, 0.6); }
        .info-header .badge { background: rgba(255, 255, 255, 0.1); padding: 1px 5px; border-radius: 3px; font-size: 9px; margin-left: 5px; }
        .info-header .badge.pinned-post { color: #e99ef0; border: 1px solid #e6308b; box-shadow: 0 0 6px #ffbffa; background: rgba(255,170,0,0.1); }

        .info-content { color: #eee; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }

        .report-panel {
            background: rgba(40, 40, 0, 0.15) !important; border: 1px solid #ffff00 !important; border-radius: 4px; padding: 10px 15px;
            margin-bottom: 25px; text-align: left; box-shadow: 0 0 12px rgba(255, 255, 0, 0.2), inset 0 0 8px rgba(255, 255, 0, 0.03) !important; position: relative; z-index: 20000; display: flex; gap: 10px; align-items: center;
        }
        .report-input { flex: 1; background: #000 !important; border: 1px solid rgba(255, 255, 0, 0.4) !important; color: #ffffff !important; padding: 8px; font-size: 13px; border-radius: 4px; outline: none; text-shadow: 0 0 3px rgba(255,255,0,0.2); }
        .report-input::placeholder { color: rgba(255, 255, 0, 0.2) !important; }
        .report-input:focus { border-color: #ffff00 !important; box-shadow: 0 0 10px rgba(255, 255, 0, 0.4) !important; }
        .btn-report-send { background: linear-gradient(135deg, rgba(255, 255, 0, 0.12) 0%, rgba(200, 200, 0, 0.22) 100%) !important; color: #ffff00 !important; border: 1px solid #ffff00 !important; padding: 8px 16px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; text-shadow: 0 0 5px #ffff00 !important; }
        .btn-report-send:hover { background: rgba(255, 255, 0, 0.25) !important; box-shadow: 0 0 12px #ffff00 !important; color: #fff !important; }

        .title-logo { text-align: center; margin-top: 10px; letter-spacing: 4px; color: white; font-size: 2rem; text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); }
        .room-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        
        .room-btn { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid #7cfc00; color: #fff; padding: 25px 15px; 
            text-align: center; font-weight: bold; transition: all 0.3s ease; position: relative; cursor: pointer; box-shadow: 0 0 8px rgba(124, 252, 0, 0.15); overflow: hidden;
        }
        .room-btn:hover { background: rgba(124, 252, 0, 0.08); box-shadow: 0 0 15px rgba(124, 252, 0, 0.5); }
        .room-btn.active { 
            border: 2px solid #ff0000 !important; background: #0a0000; box-shadow: 0 0 15px #ff0000, 0 0 35px #ff0000, inset 0 0 15px #500 !important; animation: room-pulse 1.5s infinite alternate ease-in-out;
        }
        .room-btn.active:hover { box-shadow: 0 0 25px #ff0000, 0 0 55px #ff0000, 0 0 80px #ff0000, inset 0 0 20px #800 !important; }

        .room-btn .smoke-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: 0; transition: 0.5s; }
        .room-btn.active .smoke-layer { opacity: 1; }
        .smoke { position: absolute; background: rgba(255, 0, 0, 0.12); border-radius: 50%; filter: blur(12px); }
        .smoke-1 { width: 80px; height: 80px; top: -20px; left: 10px; animation: smk-move 5s infinite linear; }
        .smoke-2 { width: 90px; height: 90px; bottom: -30px; right: 20px; animation: smk-move 6s infinite linear 1s; }

        .room-title-text { position: relative; z-index: 2; text-shadow: 0 0 5px rgba(255,255,255,0.5); font-size: 1.1rem; letter-spacing: 1px; }
        .room-btn.active .room-title-text { text-shadow: 0 0 8px #ff3333; }

        .online-badge { position: absolute; top: 6px; right: 10px; font-size: 10px; color: #ff0000; display: none; text-shadow: 0 0 5px #ff0000; font-weight: bold; z-index: 2; }
        .offline-badge { position: absolute; top: 6px; right: 10px; font-size: 10px; color: #7cfc00; display: block; text-shadow: 0 0 4px #7cfc00; z-index: 2; }
        .room-btn.active .online-badge { display: block; animation: badge-flash 1s infinite; }
        .room-btn.active .offline-badge { display: none; }
        
        #mode-popup-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 40000; align-items: center; justify-content: center;
        }
        .popup-window {
            background: rgba(15, 15, 15, 0.9); border: 2px solid #7cfc00; box-shadow: 0 0 30px rgba(124, 252, 0, 0.4), inset 0 0 15px rgba(124, 252, 0, 0.1); width: 85%; max-width: 340px; padding: 25px 20px; border-radius: 8px; text-align: center; box-sizing: border-box; animation: popup-scale 0.2s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        #popup-room-title { font-size: 1.5rem; font-weight: bold; color: #fff; margin: 0 0 20px 0; letter-spacing: 2px; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
        .mode-btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        
        .mode-btn { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; transition: all 0.2s ease; text-align: center; box-sizing: border-box; }
        .btn-judge { background: linear-gradient(135deg, rgba(255, 75, 43, 0.1) 0%, rgba(255, 65, 108, 0.2) 100%); color: #ff9999; border: 1px solid #ff416c; border-left: 6px solid #ff4b2b; box-shadow: 0 0 10px rgba(255, 65, 108, 0.2); text-shadow: 0 0 5px rgba(255, 75, 43, 0.5); }
        .btn-judge:hover { background: linear-gradient(135deg, rgba(255, 75, 43, 0.25) 0%, rgba(255, 65, 108, 0.35) 100%); box-shadow: 0 0 18px rgba(255, 65, 108, 0.6); color: #fff; text-shadow: 0 0 8px #ff4b2b; }
        .btn-player { background: linear-gradient(135deg, rgba(86, 171, 47, 0.1) 0%, rgba(168, 224, 99, 0.2) 100%); color: #bbf099; border: 1px solid #a8e063; border-left: 6px solid #56ab2f; box-shadow: 0 0 10px rgba(168, 224, 99, 0.2); text-shadow: 0 0 5px rgba(86, 171, 47, 0.5); }
        .btn-player:hover { background: linear-gradient(135deg, rgba(86, 171, 47, 0.25) 0%, rgba(168, 224, 99, 0.35) 100%); box-shadow: 0 0 18px rgba(168, 224, 99, 0.6); color: #fff; text-shadow: 0 0 8px #56ab2f; }
        .btn-close-popup { margin-top: 20px; background: rgba(255,255,255,0.02); border: 1px solid #444; color: #777; padding: 10px 20px; font-size: 13px; cursor: pointer; border-radius: 4px; width: 100%; transition: 0.2s; }
        .btn-close-popup:hover { color: #fff; border-color: #888; background: rgba(255,255,255,0.05); }

        @keyframes popup-scale { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes room-pulse { 0% { box-shadow: 0 0 15px #ff0000, 0 0 35px #ff0000, inset 0 0 15px #500; } 100% { box-shadow: 0 0 25px #ff0000, 0 0 50px #ff3333, inset 0 0 25px #800; } }
    </style>
</head>
<body style="background: black;">
<div class="container" id="main-container" style="max-width: 600px; margin: 0 auto; padding: 20px;">
<div id="board-container-wrapper">
<a class="cyber-board-link manual-board-link" href="manual.html">MANUAL</a>
<a class="cyber-board-link update-board-link" href="updates.html"><span class="blue-dot" id="update-alert-dot"></span>UPDATE LOG</a>
<div class="info-panel" id="board-container">
<div id="board-inner">お知らせを同期中...</div>
</div>
</div>
<div class="report-panel" id="report-form-panel">
<input class="report-input" id="report-text" placeholder="運営宛てにバグ報告・コメントを入力..." type="text"/>
<button class="btn-report-send" id="btn-send-report">送信</button>
</div>
<div>
<h1 class="title-logo">SELECT ROOM</h1>
<div class="room-grid" id="room-list"></div>
</div>
</div>
<div id="mode-popup-overlay">
<div class="popup-window">
<div id="popup-room-title">ROOM 01</div>
<div class="mode-btn-group">
<button class="mode-btn btn-judge" onclick="goToPage('referee.html')">◈ JUDGE MODE</button>
<button class="mode-btn btn-player" onclick="goToPage('player.html')">◈ PLAYER MODE</button>
<button class="mode-btn" onclick="goToPage('spectator.html')" style="background: linear-gradient(135deg, rgba(0, 255, 255, 0.05) 0%, rgba(0, 150, 255, 0.15) 100%); color: #00ffff; border: 1px solid rgba(0, 255, 255, 0.4); text-shadow: 0 0 5px #00ffff; box-shadow: 0 0 8px rgba(0,255,255,0.1);">◈ SPECTATOR MODE</button>
</div>
<button class="btn-close-popup" onclick="closePopup()">CANCEL</button>
</div>
</div>
<div class="admin-trigger" onclick="location.href='owner.html'">MASTER ACCESS</div>

<script src="./js/index.js" type="module"></script></body>
</html>
