<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>ダミー人形ライフ管理システム | ひだまりPJ</title>
    <meta name="description" content="リアルタイムでダミー人形のライフ（HP）や残り時間を管理・同期できる、SAO風サイバーデザインのトレーニング・ゲーム用管理システムです。">
    <meta name="keywords" content="ダミー人形, ライフ管理, タイマー同期, Firebase, SAO風UI, ひだまり">

    <link rel="stylesheet" href="style.css">
    <style>
        #main-container { display: none; }
        
        /* サイバーメンテナンス画面 */
        #main-maintenance-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a0000 0%, #000000 100%);
            color: #ff3333; z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Courier New', Courier, monospace; text-align: center;
            overflow: hidden;
        }

        #main-maintenance-overlay::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotate(15deg);
            animation: grid-move 20s linear infinite;
            z-index: 1;
        }

        .m-box { 
            position: relative; z-index: 2;
            border: 2px solid #ff3333; 
            padding: 40px 60px; 
            background: rgba(20, 0, 0, 0.85); 
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.6), inset 0 0 20px rgba(255, 51, 51, 0.3); 
            border-radius: 4px; 
            backdrop-filter: blur(5px);
        }

        .m-box h1 {
            font-size: 2.8rem;
            margin: 0 0 15px 0;
            letter-spacing: 6px;
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333, 0 0 20px #ff3333;
            animation: blink 2s infinite alternate;
        }

        .m-box p {
            font-size: 1.1rem;
            color: #ff9999;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }

        .m-sub-text {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #660000;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulse 1s infinite alternate;
        }
        
        .admin-trigger { position: fixed; bottom: 10px; right: 10px; opacity: 0.1; cursor: pointer; color: white; font-size: 10px; z-index: 10001; padding: 15px; }
        #owner-status-badge { display: none; text-align: center; color: #00ffff; font-size: 11px; margin-bottom: 5px; text-shadow: 0 0 5px #00ffff; letter-spacing: 1px; }

        /* 掲示板パネル */
        .info-panel { 
            margin: 10px 0 25px 0; 
            background: rgba(124, 252, 0, 0.01); 
            border: 1px solid #7cfc00; 
            border-radius: 4px; 
            padding: 15px; 
            text-align: left; 
            box-shadow: 0 0 15px rgba(124, 252, 0, 0.3), inset 0 0 10px rgba(124, 252, 0, 0.05);
            max-height: 250px;
            overflow-y: auto;
        }
        
        .info-panel::-webkit-scrollbar { width: 6px; }
        .info-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .info-panel::-webkit-scrollbar-thumb { background: #7cfc00; border-radius: 3px; box-shadow: 0 0 5px #7cfc00; }

        .news-item {
            border-bottom: 1px dashed rgba(124, 252, 0, 0.2);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .news-item.is-pinned {
            border-bottom: 1px solid #ffaa00;
            background: rgba(255, 170, 0, 0.03);
            margin-bottom: 15px;
            padding-bottom: 15px;
        }

        .info-header { 
            color: #7cfc00; 
            font-size: 0.75rem; 
            letter-spacing: 2px; 
            margin-bottom: 6px; 
            display: flex; 
            justify-content: space-between; 
            text-shadow: 0 0 5px rgba(124, 252, 0, 0.6);
        }

        /* ★ひだまりさん指定カスタムカラー（ピン留めヘッダー） */
        .is-pinned .info-header {
            color: #4c64e7;
            text-shadow: 0 0 5px rgba(255, 170, 0, 0.6);
        }

        /* ★ひだまりさん指定カスタムカラー（バッジ類） */
        .info-header .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 9px;
            margin-left: 5px;
        }
        .info-header .badge.pinned-post { color: #e99ef0; border: 1px solid #e6308b; box-shadow: 0 0 6px #ffbffa; background: rgba(255,170,0,0.1); }
        .info-header .badge.hidden-post { color: #ff4d4d; border: 1px solid #ff4d4d; box-shadow: 0 0 4px #ff4d4d; }
        .info-header .badge.reserve-post { color: #00ffff; border: 1px solid #00ffff; box-shadow: 0 0 4px #00ffff; }

        .info-content { color: #eee; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }

        .admin-action-bar {
            margin-top: 8px;
            display: flex;
            gap: 15px;
            font-size: 11px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 5px;
        }
        .admin-action-bar span { cursor: pointer; text-decoration: underline; }
        .admin-action-bar .act-del { color: #ff4d4d; }
        .admin-action-bar .act-hide { color: #ffaa00; }
        .admin-action-bar .act-pin { color: #00ffff; }

        .title-logo { text-align: center; margin-top: 10px; letter-spacing: 4px; color: white; font-size: 2rem; text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); }
        
        /* ルームグリッドと進化したボタンレイアウト */
        .room-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        
        .room-btn { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid #7cfc00; 
            color: #fff; 
            padding: 25px 15px; 
            text-align: center; 
            font-weight: bold; 
            transition: all 0.3s ease; 
            position: relative; 
            cursor: pointer; 
            box-shadow: 0 0 8px rgba(124, 252, 0, 0.15);
            overflow: hidden;
        }
        
        .room-btn:hover { 
            background: rgba(124, 252, 0, 0.08); 
            box-shadow: 0 0 15px rgba(124, 252, 0, 0.5); 
        }
        
        .room-btn.selected { 
            background: rgba(255, 255, 255, 0.12); 
            border: 2px solid #ffffff; 
            box-shadow: 0 0 20px #ffffff, 0 0 10px #7cfc00; 
            text-shadow: 0 0 8px #ffffff;
        }
        
        /* 使用中の時のハイパー赤発光＆脈動アニメーション */
        .room-btn.active { 
            border: 2px solid #ff0000 !important; 
            background: #0a0000;
            box-shadow: 
                0 0 15px #ff0000, 
                0 0 35px #ff0000, 
                inset 0 0 15px #500 !important;
            animation: room-pulse 1.5s infinite alternate ease-in-out;
        }
        .room-btn.active:hover {
            box-shadow: 
                0 0 25px #ff0000, 
                0 0 55px #ff0000, 
                0 0 80px #ff0000,
                inset 0 0 20px #800 !important;
        }

        /* 使用中ボタンの内側から湧き出る煙エフェクト */
        .room-btn .smoke-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; opacity: 0; transition: 0.5s;
        }
        .room-btn.active .smoke-layer { opacity: 1; }
        
        .smoke {
            position: absolute; background: rgba(255, 0, 0, 0.12); border-radius: 50%; filter: blur(12px);
        }
        .smoke-1 { width: 80px; height: 80px; top: -20px; left: 10px; animation: smk-move 5s infinite linear; }
        .smoke-2 { width: 90px; height: 90px; bottom: -30px; right: 20px; animation: smk-move 6s infinite linear 1s; }

        .room-title-text { position: relative; z-index: 2; text-shadow: 0 0 5px rgba(255,255,255,0.5); font-size: 1.1rem; letter-spacing: 1px; }
        .room-btn.active .room-title-text { text-shadow: 0 0 8px #ff3333; }

        .online-badge { position: absolute; top: 6px; right: 10px; font-size: 10px; color: #ff0000; display: none; text-shadow: 0 0 5px #ff0000; font-weight: bold; z-index: 2; }
        .offline-badge { position: absolute; top: 6px; right: 10px; font-size: 10px; color: #7cfc00; display: block; text-shadow: 0 0 4px #7cfc00; z-index: 2; }
        .room-btn.active .online-badge { display: block; animation: badge-flash 1s infinite; }
        .room-btn.active .offline-badge { display: none; }
        
        #mode-selection { display: none; flex-direction: column; gap: 15px; align-items: center; margin-top: 25px; }
        .mode-btn { width: 280px; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.2s; }
        .mode-btn:active { transform: scale(0.98); }
        .btn-judge { background: linear-gradient(90deg, #ff4b2b 0%, #ff416c 100%); color: white; border-left: 8px solid #911b1b; }
        .btn-player { background: linear-gradient(90deg, #56ab2f 0%, #a8e063 100%); color: white; border-left: 8px solid #2d5a19; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; border: 2px solid #7cfc00; box-shadow: 0 0 30px #7cfc00; padding: 20px; z-index: 30000; width: 320px; border-radius: 6px; }
        .modal h3 { margin-top: 0; color: #7cfc00; text-shadow: 0 0 5px #7cfc00; }
        .modal textarea { width: 100%; height: 120px; background: #000; border: 1px solid #555; color: #fff; padding: 8px; box-sizing: border-box; resize: none; margin-bottom: 10px; font-size: 14px; }
        .modal input[type="datetime-local"] { width: 100%; background: #000; border: 1px solid #555; color: #fff; padding: 6px; box-sizing: border-box; margin-bottom: 15px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 10px; font-weight: bold; cursor: pointer; border: none; }

        /* アニメーション定義 */
        @keyframes grid-move { 0% { transform: rotate(15deg) translateY(0); } 100% { transform: rotate(15deg) translateY(40px); } }
        @keyframes blink { 0%, 90%, 94%, 98%, 100% { opacity: 1; text-shadow: 0 0 10px #ff3333, 0 0 20px #ff3333; } 92%, 96% { opacity: 0.3; text-shadow: none; } }
        @keyframes pulse { 0% { color: #550000; } 100% { color: #ff0000; text-shadow: 0 0 5px #ff0000; } }
        @keyframes badge-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes smk-move { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(20px, -20px) scale(1.3); opacity: 0; } }
        
        @keyframes room-pulse {
            0% { box-shadow: 0 0 15px #ff0000, 0 0 35px #ff0000, inset 0 0 15px #500; }
            100% { box-shadow: 0 0 25px #ff0000, 0 0 50px #ff3333, inset 0 0 25px #800; }
        }
    </style>
</head>
<body style="background: black;">
    <div id="main-maintenance-overlay">
        <div class="m-box">
            <h1>WARNING</h1>
            <p>SYSTEM UNDER MAINTENANCE</p>
            <div style="font-size: 0.9rem; margin-top: 10px; color: #ff5555; opacity: 0.8;">全てのルームへのアクセスが一時的に制限されています。</div>
            <div class="m-sub-text">◈ CODE: ACCESS_DENIED_BY_ADMIN ◈</div>
        </div>
        <div class="admin-trigger" onclick="adminAuth()" style="opacity: 0.02;">MASTER ACCESS</div>
    </div>

    <div id="main-container" class="container" style="max-width: 600px; margin: 0 auto; padding: 20px;">
        
        <div id="owner-status-badge">【 OWNER SYSTEM CONTROL ACTIVE 】</div>

        <div class="info-panel" id="board-container">
            <div id="board-inner">お知らせを同期中...</div>
        </div>

        <h1 class="title-logo">SELECT ROOM</h1>
        <div class="room-grid" id="room-list"></div>
        
        <div id="control-area" style="margin-top: 40px; text-align: center;">
            <p id="selected-room-display" style="font-size: 1.2rem; margin-bottom: 15px; color: #888;">ルームを選択してください</p>
            <div id="mode-selection">
                <button onclick="goToPage('referee.html')" class="mode-btn btn-judge">◈ JUDGE MODE</button>
                <button onclick="goToPage('player.html')" class="mode-btn btn-player">◈ PLAYER MODE</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="news-modal">
        <h3>NEW NOTIFICATION</h3>
        <textarea id="modal-text" placeholder="お知らせ内容を入力（改行可能）"></textarea>
        <label style="font-size: 11px; color: #aaa;">予約日時 (空欄で即時投稿):</label>
        <input type="datetime-local" id="modal-time">
        <div class="modal-btns">
            <button onclick="submitNews()" style="background:#7cfc00; color:#000;">POST</button>
            <button onclick="closeModal()" style="background:#333; color:#fff;">CANCEL</button>
        </div>
    </div>

    <div class="admin-trigger" onclick="adminAuth()">MASTER ACCESS</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, get, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCIBxNvfpaSV3sBS-VKtDob4zYhZJ7djIk",
            authDomain: "hidamari-pj-8b4bb.firebaseapp.com",
            databaseURL: "https://hidamari-pj-8b4bb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hidamari-pj-8b4bb",
            storageBucket: "hidamari-pj-8b4bb.firebasestorage.app",
            messagingSenderId: "293093126367",
            appId: "1:293093126367:web:151cce22308352fa5ff96a",
            measurementId: "G-7NNBEZBNXZ"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const isLocalEnv = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";
        const sysPath = isLocalEnv ? "system_local" : "system";

        let isOwner = sessionStorage.getItem('isOwnerMode') === 'true';
        
        const MASTER_HASH = "d6c61b07926d88b2547eec66fb7dcc8df859a4368ef07bce99406dc5d6dd9001";

        if (isOwner) {
            document.getElementById('owner-status-badge').style.display = 'block';
        }

        const cachedBoard = localStorage.getItem(`cached_board_html_${sysPath}`);
        if (cachedBoard && !isOwner) { document.getElementById('board-inner').innerHTML = cachedBoard; }

        async function sha256(text) {
            const msgUint8 = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        onValue(ref(db, `${sysPath}/masterMaintenance`), (snap) => {
            const isMaint = snap.val();
            document.getElementById('main-maintenance-overlay').style.display = isMaint ? 'flex' : 'none';
            document.getElementById('main-container').style.display = isMaint ? 'none' : 'block';
        });

        onValue(ref(db, `${sysPath}/news_list`), (snap) => {
            const data = snap.val();
            const container = document.getElementById('board-inner');
            if (!data) {
                container.innerHTML = '<div style="color:#666; text-align:center;">お知らせはありません。</div>';
                localStorage.removeItem(`cached_board_html_${sysPath}`);
                return;
            }

            let html = "";
            const now = Date.now();

            const keys = Object.keys(data).sort((a, b) => {
                const pinA = data[a].pinned === true ? 1 : 0;
                const pinB = data[b].pinned === true ? 1 : 0;
                if (pinA !== pinB) return pinB - pinA;
                return data[b].timestamp - data[a].timestamp;
            });

            keys.forEach(key => {
                const item = data[key];
                const isReserved = item.releaseTime && item.releaseTime > now;
                const isHidden = item.hidden === true;
                const isPinned = item.pinned === true;

                if (!isOwner && (isHidden || isReserved)) return;

                let badgeHtml = "";
                if (isPinned) badgeHtml += '<span class="badge pinned-post">📌 PINNED</span>';
                if (isHidden) badgeHtml += '<span class="badge hidden-post">非表示中</span>';
                if (isReserved) badgeHtml += `<span class="badge reserve-post">予約(${new Date(item.releaseTime).toLocaleString()})</span>`;

                html += `
                    <div class="news-item ${isPinned ? 'is-pinned' : ''}" id="item-${key}">
                        <div class="info-header">
                            <span>SYSTEM NOTIFICATION ${badgeHtml}</span>
                            <span>${item.date}</span>
                        </div>
                        <div class="info-content">${escapeHTML(item.text)}</div>
                `;

                if (isOwner) {
                    html += `
                        <div class="admin-action-bar">
                            <span class="act-pin" onclick="window.togglePin('${key}', ${isPinned})">${isPinned ? '◈ ピン解除' : '◈ ピン留め'}</span>
                            <span class="act-hide" onclick="window.toggleHide('${key}', ${isHidden})">${isHidden ? '◈ 表示に戻す' : '◈ 非表示'}</span>
                            <span class="act-del" onclick="window.deleteNews('${key}')">◈ 削除</span>
                        </div>
                    `;
                }
                html += `</div>`;
            });

            container.innerHTML = html || '<div style="color:#666; text-align:center;">お知らせはありません。</div>';
            if (!isOwner) { localStorage.setItem(`cached_board_html_${sysPath}`, container.innerHTML); }
        });

        function escapeHTML(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        window.adminAuth = async () => {
            try {
                const input = prompt("MASTER PASSWORD:");
                if (!input) return;

                const hashedInput = await sha256(input);
                if (hashedInput === MASTER_HASH) {
                    const choice = prompt("認証成功：\n1: メンテナンス切替\n2: 新しいお知らせを投稿\n3: オーナーモード切替 (掲示板編集権限)");
                    
                    if (choice === "1") {
                        await set(ref(db, `${sysPath}/auth_token`), MASTER_HASH);
                        const snap = await get(ref(db, `${sysPath}/masterMaintenance`));
                        await set(ref(db, `${sysPath}/masterMaintenance`), !snap.val());
                        await remove(ref(db, `${sysPath}/auth_token`));
                        alert("STATUS CHANGED.");
                    } else if (choice === "2") {
                        document.getElementById('news-modal').style.display = 'block';
                    } else if (choice === "3") {
                        isOwner = !isOwner;
                        sessionStorage.setItem('isOwnerMode', isOwner);
                        alert(`オーナー管理モードを ${isOwner ? "ON" : "OFF"} にしました。`);
                        location.reload();
                    }
                } else { alert("ACCESS DENIED."); }
            } catch (error) { alert("ERROR:\n" + error.message); }
        };

        window.closeModal = () => { document.getElementById('news-modal').style.display = 'none'; };
        window.submitNews = async () => {
            const text = document.getElementById('modal-text').value;
            const timeVal = document.getElementById('modal-time').value;
            if (!text) return;

            try {
                await set(ref(db, `${sysPath}/auth_token`), MASTER_HASH);
                const releaseTime = timeVal ? new Date(timeVal).getTime() : Date.now();

                const newPostRef = push(ref(db, `${sysPath}/news_list`));
                await set(newPostRef, {
                    text: text,
                    date: new Date(releaseTime).toLocaleDateString(),
                    timestamp: Date.now(),
                    releaseTime: releaseTime,
                    hidden: false,
                    pinned: false
                });

                await remove(ref(db, `${sysPath}/auth_token`));
                document.getElementById('modal-text').value = "";
                document.getElementById('modal-time').value = "";
                closeModal();
                alert("投稿を完了しました。");
            } catch (e) { alert("投稿エラー: " + e.message); }
        };

        window.togglePin = async (key, currentStatus) => {
            const actionText = currentStatus ? "ピン留めを解除しますか？" : "この投稿を一番上にピン留めしますか？\n（※他のピン留めは自動的に解除されます）";
            if (!confirm(actionText)) return;

            try {
                await set(ref(db, `${sysPath}/auth_token`), MASTER_HASH);
                if (!currentStatus) {
                    const snap = await get(ref(db, `${sysPath}/news_list`));
                    const data = snap.val();
                    if (data) {
                        for (const k in data) {
                            if (data[k].pinned === true) {
                                await set(ref(db, `${sysPath}/news_list/${k}/pinned`), false);
                            }
                        }
                    }
                }
                await set(ref(db, `${sysPath}/news_list/${key}/pinned`), !currentStatus);
                await remove(ref(db, `${sysPath}/auth_token`));
            } catch (e) { alert("ピン留めエラー: " + e.message); }
        };

        window.toggleHide = async (key, currentStatus) => {
            if (!confirm("表示状態を切り替えますか？")) return;
            try {
                await set(ref(db, `${sysPath}/auth_token`), MASTER_HASH);
                await set(ref(db, `${sysPath}/news_list/${key}/hidden`), !currentStatus);
                await remove(ref(db, `${sysPath}/auth_token`));
            } catch (e) { alert("エラー: " + e.message); }
        };

        window.deleteNews = async (key) => {
            if (!confirm("この投稿を完全に削除しますか？")) return;
            try {
                await set(ref(db, `${sysPath}/auth_token`), MASTER_HASH);
                await remove(ref(db, `${sysPath}/news_list/${key}`));
                await remove(ref(db, `${sysPath}/auth_token`));
            } catch (e) { alert("エラー: " + e.message); }
        };

        let selectedRoom = "";
        const roomList = document.getElementById('room-list');
        for (let i = 1; i <= 10; i++) {
            const roomId = `room${i}`;
            const btn = document.createElement('div');
            btn.className = 'room-btn';
            
            btn.innerHTML = `
                <div class="smoke-layer">
                    <div class="smoke smoke-1"></div>
                    <div class="smoke smoke-2"></div>
                </div>
                <div class="room-title-text">ROOM ${i.toString().padStart(2, '0')}</div>
                <span class="online-badge">● IN USE</span>
                <span class="offline-badge">● EMPTY</span>
            `;
            
            btn.onclick = () => {
                selectedRoom = roomId;
                document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('selected-room-display').innerText = `ROOM ${i.toString().padStart(2, '0')} SELECTED`;
                document.getElementById('selected-room-display').style.color = '#7cfc00';
                document.getElementById('mode-selection').style.display = 'flex';
            };
            roomList.appendChild(btn);
            
            onValue(ref(db, `rooms/${roomId}/online`), (snapshot) => {
                if (snapshot.val() === true) {
                    btn.classList.add('active');
                    get(ref(db, `rooms/${roomId}/referees`)).then(refSnap => {
                        if (!refSnap.exists()) {
                            remove(ref(db, `rooms/${roomId}/online`));
                            remove(ref(db, `rooms/${roomId}/config`));
                        }
                    });
                } else { btn.classList.remove('active'); }
            });
        }
        window.goToPage = (page) => { if (selectedRoom) window.location.href = `${page}?room=${selectedRoom}`; };
    </script>
</body>
</html>
