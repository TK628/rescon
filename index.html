<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダミー人形ライフ管理システム</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .room-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .room-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid white;
            color: white;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            transition: 0.3s;
            position: relative;
            cursor: pointer;
        }
        .room-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .room-btn.selected { background: rgba(255, 255, 255, 0.4); border: 2px solid #7cfc00; }
        
        /* オンラインバッジのデザイン */
        .online-badge {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 10px;
            color: #7cfc00;
            display: none;
            text-shadow: 0 0 5px #7cfc00;
        }
        .room-btn.active .online-badge { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-top: 30px; letter-spacing: 2px;">SELECT ROOM</h1>
        
        <div class="room-grid" id="room-list"></div>

        <div id="control-area" style="margin-top: 40px; text-align: center;">
            <p id="selected-room-display" style="font-size: 1.2rem; margin-bottom: 15px;">ルームを選択してください</p>
            <div id="mode-selection" style="display: none; gap: 20px; justify-content: center;">
                <button onclick="goToPage('referee.html')" class="btn btn-primary" style="width: 120px;">JUDGE</button>
                <button onclick="goToPage('player.html')" class="btn btn-secondary" style="width: 120px;">PLAYER</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIBxNvfpaSV3sBS-VKtDob4zYhZJ7djIk",
            authDomain: "hidamari-pj-8b4bb.firebaseapp.com",
            databaseURL: "https://hidamari-pj-8b4bb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hidamari-pj-8b4bb",
            storageBucket: "hidamari-pj-8b4bb.firebasestorage.app",
            messagingSenderId: "293093126367",
            appId: "1:293093126367:web:151cce22308352fa5ff96a",
            measurementId: "G-7NNBEZBNXZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let selectedRoom = "";

        const roomList = document.getElementById('room-list');
        for (let i = 1; i <= 10; i++) {
            const roomId = `room${i}`;
            const btn = document.createElement('div');
            btn.id = `btn-${roomId}`;
            btn.className = 'room-btn';
            btn.innerHTML = `ROOM ${i.toString().padStart(2, '0')}<span class="online-badge">● ONLINE</span>`;
            
            btn.onclick = () => {
                selectedRoom = roomId;
                document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('selected-room-display').innerText = `ROOM ${i.toString().padStart(2, '0')} SELECTED`;
                document.getElementById('mode-selection').style.display = 'flex';
            };
            roomList.appendChild(btn);

            // ルームごとのオンライン監視
            onValue(ref(db, `rooms/${roomId}/online`), (snapshot) => {
                if (snapshot.val() === true) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        window.goToPage = (page) => {
            if (selectedRoom) {
                window.location.href = `${page}?room=${selectedRoom}`;
            }
        };
    </script>
</body>
</html>
