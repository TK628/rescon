<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAO Login - Dummy System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* index専用のデザイン */
        .menu-container { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            margin-top: 50px; 
        }
        .entry-btn {
            background: rgba(255, 255, 255, 0.15); 
            border: 2px solid white; 
            color: white;
            padding: 25px; 
            font-size: 1.5rem; 
            font-weight: bold; 
            text-decoration: none; 
            text-align: center;
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); 
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .entry-btn:hover { 
            background: white; 
            color: #333; 
            transform: translateX(10px); 
        }
        .entry-btn span {
            display: block;
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-top: 50px; text-shadow: 3px 3px 0px rgba(0,0,0,0.2);">
            SYSTEM LOGIN
        </h1>
        
        <div class="menu-container">
            <a href="referee.html" class="entry-btn">
                JUDGE MODE
                <span>(審判・管理者操作用)</span>
            </a>
            
            <a href="player.html" class="entry-btn">
                PLAYER MODE
                <span>(選手・閲覧専用モニター)</span>
            </a>
        </div>

        <div style="margin-top: 80px; text-align: center; opacity: 0.6; font-size: 12px;">
            <p>TACTICAL TRAINING SYSTEM v2.5</p>
            <p>Connection: Online (Firebase Shared)</p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
