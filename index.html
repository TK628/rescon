<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダミー人形ライフ管理システム</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* メンテナンス中専用の画面デザイン */
        #main-maintenance-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #ff4d4d; z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Courier New', Courier, monospace; text-align: center;
        }
        .m-box { border: 2px solid #ff4d4d; padding: 40px; background: rgba(255,0,0,0.1); box-shadow: 0 0 20px #ff4d4d; }
        
        /* 管理者用スイッチ（隠しボタン風） */
        .admin-trigger { position: fixed; bottom: 10px; right: 10px; opacity: 0.1; cursor: pointer; color: white; font-size: 10px; }

        .room-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 30px; }
        .room-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid #7cfc00; color: white;
            padding: 20px; text-align: center; font-weight: bold; transition: 0.3s;
            position: relative; cursor: pointer;
        }
        .room-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .room-btn.selected { background: rgba(255, 255, 255, 0.4); border: 2px solid white; }
        .room-btn.active { border: 1px solid #ff4d4d; }
        .online-badge { position: absolute; top: 5px; right: 10px; font-size: 10px; color: #ff4d4d; display: none; text-shadow: 0 0 5px #ff4d4d; }
        .offline-badge { position: absolute; top: 5px; right: 10px; font-size: 10px; color: #7cfc00; display: block; text-shadow: 0 0 5px #7cfc00; }
        .room-btn.active .online-badge { display: block; }
        .room-btn.active .offline-badge { display: none; }
        #mode-selection { display: none; flex-direction: column; gap: 15px; align-items: center; margin-top: 20px; }
        .mode-btn { width: 280px; padding: 15px; font-size: 18px; font-weight: bold; text-align: left; border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; }
        .mode-btn span { font-size: 12px; opacity: 0.8; font-weight: normal; margin-top: 4px; }
        .btn-judge { background: linear-gradient(90deg, #ff4b2b 0%, #ff416c 100%); color: white; border-left: 8px solid #911b1b; }
        .btn-player { background: linear-gradient(90deg, #56ab2f 0%, #a8e063 100%); color: white; border-left: 8px solid #2d5a19; }
    </style>
</head>
<body>
    <!-- メンテナンス専用ページ -->
    <div id="main-maintenance-overlay">
        <div class="m-box">
            <h1 style="font-size: 3rem; margin-bottom: 20px; letter-spacing: 5px;">SYSTEM DOWN</h1>
            <p style="font-size: 1.2rem; line-height: 1.8;">
                [ WARNING ]<br>
                只今、サーバーのメンテナンスを実施しております。<br>
                完了まで全ての機能がロックされます。<br>
                <span style="color: #555; font-size: 0.9rem; margin-top: 20px; display: block;">UNDER MAINTENANCE - PLEASE WAIT</span>
            </p>
        </div>
        <!-- メンテナンス中でもオーナーだけは解除画面を呼び出せる -->
        <div class="admin-trigger" onclick="adminAuth()">MASTER ACCESS</div>
    </div>

    <div class="container">
        <h1 style="text-align: center; margin-top: 30px; letter-spacing: 2px;">SELECT ROOM</h1>
        <div class="room-grid" id="room-list"></div>
        <div id="control-area" style="margin-top: 40px; text-align: center;">
            <p id="selected-room-display" style="font-size: 1.2rem; margin-bottom: 15px;">ルームを選択してください</p>
            <div id="mode-selection">
                <button onclick="goToPage('referee.html')" class="mode-btn btn-judge">◈ JUDGE MODE<span>審判：部屋の作成・タイマーとライフの管理</span></button>
                <button onclick="goToPage('player.html')" class="mode-btn btn-player">◈ PLAYER MODE<span>選手：ライフとタイマーのリアルタイム確認</span></button>
            </div>
        </div>
    </div>

    <div class="admin-trigger" onclick="adminAuth()">MASTER ACCESS</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCIBxNvfpaSV3sBS-VKtDob4zYhZJ7djIk",
            authDomain: "hidamari-pj-8b4bb.firebaseapp.com",
            databaseURL: "https://hidamari-pj-8b4bb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hidamari-pj-8b4bb",
            storageBucket: "hidamari-pj-8b4bb.firebasestorage.app",
            messagingSenderId: "293093126367",
            appId: "1:293093126367:web:151cce22308352fa5ff96a",
            measurementId: "G-7NNBEZBNXZ"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // マスターメンテナンス監視
        onValue(ref(db, 'system/masterMaintenance'), (snap) => {
            document.getElementById('main-maintenance-overlay').style.display = snap.val() ? 'flex' : 'none';
        });

        // オーナー専用：パスワードでメンテナンス切り替え
        window.adminAuth = () => {
            const pass = prompt("マスターパスワードを入力してください:");
            if (pass === "55kaket123") { // パスワードはここで自由に変更してください
                get(ref(db, 'system/masterMaintenance')).then((snap) => {
                    const current = snap.val();
                    const next = !current;
                    if (confirm(`システム全体を ${next ? 'メンテナンス中' : '稼働中'} に切り替えますか？`)) {
                        set(ref(db, 'system/masterMaintenance'), next);
                    }
                });
            } else if (pass !== null) {
                alert("認証に失敗しました。");
            }
        };

        let selectedRoom = "";
        const roomList = document.getElementById('room-list');
        for (let i = 1; i <= 10; i++) {
            const roomId = `room${i}`;
            const btn = document.createElement('div');
            btn.className = 'room-btn';
            btn.innerHTML = `ROOM ${i.toString().padStart(2, '0')}<span class="online-badge">● IN USE</span><span class="offline-badge">● EMPTY</span>`;
            btn.onclick = () => {
                selectedRoom = roomId;
                document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('selected-room-display').innerText = `ROOM ${i.toString().padStart(2, '0')} SELECTED`;
                document.getElementById('mode-selection').style.display = 'flex';
            };
            roomList.appendChild(btn);
            onValue(ref(db, `rooms/${roomId}/online`), (snapshot) => {
                if (snapshot.val() === true) { btn.classList.add('active'); }
                else { btn.classList.remove('active'); }
            });
        }
        window.goToPage = (page) => { if (selectedRoom) { window.location.href = `${page}?room=${selectedRoom}`; } };
    </script>
</body>
</html>
